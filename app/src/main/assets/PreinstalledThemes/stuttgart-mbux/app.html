<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stuttgart Sport</title>
<style>
  /* Alpha 7.4: painel no estilo MBUX "Sport", desenhado a partir da foto de referência.
     Túnel vermelho no centro (velocidade no topo, rotação embaixo, meias-luas que enchem com o
     giro), escalas de bateria e potência, círculo de força G e círculo de consumo e cabine.
     A geometria sai de scripts/gerar-stuttgart-mbux.mjs; o que está entre os marcadores GERADO
     não se edita à mão.

     O que a foto mostra e o contrato v1.0 não tem (torque, pressão do turbo, temperatura do óleo,
     limitador, freio de mão) foi trocado por dado real do carro: bateria, consumo, temperatura
     da cabine e hodômetro. A força G é longitudinal e sai da variação da velocidade; o carro não
     informa aceleração lateral, então o ponto só anda na vertical. */
  @font-face {
    font-family: 'ExoV';
    font-weight: 300 800;
    font-style: normal;
    font-display: swap;
    src: url('ExoV.woff2') format('woff2');
  }

  :root {
    --ink: #f1f0f5;
    --ink-dim: rgba(241, 240, 245, 0.62);
    --ink-faint: rgba(241, 240, 245, 0.38);
    --label: rgba(214, 212, 224, 0.92);
    /* Cor do túnel: o JS troca pela escolha em "Cor do painel" (ou pelo modo de condução). */
    --acc: #ff1f14;
    --acc-hi: #ff8a82;
    --acc-lo: #80100a;
    --ok: #34d35c;
    --power: #ff8a2a;
    --charge: #37a8ff;
    --night-tint: #ff9500;
  }

  /* Farol aceso: o app liga a classe e injeta --night-tint (Telas > cor do modo noturno). O texto
     passa para essa cor; o túnel continua na cor escolhida e a placa continua branca e vermelha. */
  body.mode-headlight {
    --ink: var(--night-tint, #ff9500);
    --label: var(--night-tint, #ff9500);
    --ink-dim: rgba(242, 240, 245, 0.55);
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 720px;
    /* html fica transparente: ceder a tela (yield-to-car) tem de revelar o que está atrás. */
    background: transparent;
    overflow: hidden;
    font-family: 'ExoV', 'Segoe UI', Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
  }
  /* 1.0.1: o body não pinta fundo. Com a caixa da projeção declarada, o app põe o vídeo POR BAIXO
     da página; um body opaco cobria o vão inteiro e a projeção nunca aparecia. O fundo opaco
     mora no #bg, que é o que a máscara do vão recorta. */
  body { background-color: transparent; }

  /* O fundo (céu, serras e túnel) mora num elemento próprio: é nele que o vão da projeção abre o
     buraco, sem levar junto os números e as meias-luas, que ficam no #app por cima. */
  /* 1.0.1: o #bg NÃO tem camada própria (will-change). No WebView do app a página abre ainda sem
     tamanho; a camada do fundo saía rasterizada na escala errada e o túnel ficava deslocado e menor
     que as meias-luas e o texto (visto no emulador na 8.6, mesmo com a camada criada depois). Sem
     camada, o brilho desfocado é repintado junto do que muda por cima dele. */
  #bg { position: absolute; left: 0; top: 0; width: 1920px; height: 720px; z-index: 0; background-color: #030205; }
  #bg svg { position: absolute; left: 0; top: 0; width: 1920px; height: 720px; }
  /* Noite: um véu escuro DENTRO do #bg (o mesmo resultado da antiga opacidade 0,62 sobre o body
     escuro), para o fundo continuar opaco fora do vão. */
  #bg::after { content: ''; position: absolute; left: 0; top: 0; width: 1920px; height: 720px; background: #030205; opacity: 0; }
  body.night-mode #bg::after { opacity: 0.38; }
  body.yield-to-car #bg { opacity: 0; }

  #projscrim {
    position: absolute; display: none; z-index: 0; pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 62%, rgba(0,0,0,.72) 100%);
  }
  body.projetando #projscrim { display: block; }

  #app {
    position: absolute; left: 0; top: 0; width: 1920px; height: 720px; z-index: 1;
    transition: opacity 0.25s ease;
  }
  #app.hidden { opacity: 0; pointer-events: none; }
  /* 1.0.1: sem animação de abertura no #app. Ela punha o contêiner inteiro numa camada rasterizada
     na escala do primeiro quadro; no WebView do Android o desenho saía deslocado e menor que o
     layout quando o WebView mudava de escala logo depois de abrir (visto no emulador na 8.6). */
  #vivo { position: absolute; left: 0; top: 0; width: 1920px; height: 720px; }

  /* ---------- SVG: cores ---------- */
  .s-acc { stop-color: var(--acc); }
  .s-acc-hi { stop-color: var(--acc-hi); }
  .s-acc-lo { stop-color: var(--acc-lo); }
  .estrelas { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; opacity: 0.32; }
  .separador path { fill: none; stroke: url(#gAroCinza); stroke-width: 1.5; opacity: 0.6; }
  .chao { fill: none; stroke: rgba(255, 255, 255, 0.06); stroke-width: 1.5; }
  .anel { fill: none; stroke: url(#gPontos); stroke-linecap: round; }
  .anel-linha { fill: none; stroke: rgba(255, 255, 255, 0.1); stroke-width: 1.2; }
  .parede { fill: url(#gParede); }
  .quente-halo-largo { fill: none; stroke: url(#gHalo); stroke-width: 46; }
  .quente-halo { fill: none; stroke: url(#gQuente); stroke-width: 16; opacity: 0.85; }
  .quente-meio { fill: none; stroke: url(#gQuente); stroke-width: 7; stroke-linecap: round; }
  .quente-nucleo { fill: none; stroke: url(#gNucleo); stroke-width: 3.5; stroke-linecap: round; }
  .meia-lua-trilho { fill: url(#gTrilhoMeiaLua); stroke: var(--acc); stroke-opacity: 0.6; stroke-width: 1.5; }
  .contorno-alto { fill: none; stroke: url(#gContornoAlto); stroke-width: 2.5; }
  .aro-cinza { fill: none; stroke: url(#gAroCinza); stroke-width: 2; }
  .linha-vel { stroke: url(#gLinhaVel); stroke-width: 3; stroke-linecap: round; }
  .friso-base { fill: none; stroke: url(#gFrisoBase); stroke-width: 2.5; }
  .bisel-base { fill: none; stroke: rgba(210, 210, 225, 0.35); stroke-width: 2; }
  .trilho { fill: none; stroke: rgba(220, 220, 235, 0.22); stroke-width: 6; stroke-linecap: round; }
  .escala-rotulos text { font-size: 34px; font-weight: 500; fill: var(--ink); }
  .escala-rotulos .un { font-size: 20px; fill: var(--ink-dim); }
  .escala-rotulos .escala-titulo { font-size: 15px; font-weight: 600; letter-spacing: 3px; fill: var(--ink-faint); }
  .circulo-borda { fill: none; stroke: rgba(255, 255, 255, 0.14); stroke-width: 1.2; }
  .circulo-disco { fill: #050308; fill-opacity: 0.88; }
  .circulo-aro { fill: none; stroke: url(#gAroCirculo); stroke-width: 5; }
  .g-anel { fill: none; stroke: var(--acc); stroke-opacity: 0.9; }
  .g-cruz { fill: none; stroke: var(--acc); stroke-width: 3; }
  .circulo-titulo { font-size: 20px; font-weight: 500; fill: var(--label); }
  .dados-trilho { fill: none; stroke: rgba(255, 255, 255, 0.1); stroke-width: 3; }
  .dados-traco { fill: none; stroke: #e8e8ee; stroke-width: 4; }
  .dados-lim { font-size: 17px; font-weight: 500; fill: var(--ink); }
  .cabine-trilho { fill: none; stroke: rgba(255, 255, 255, 0.18); stroke-width: 6; }
  .cabine-quente { fill: none; stroke: #ff3a2a; stroke-width: 6; }

  .borda-quente { stroke: url(#gBorda); stroke-width: 3; }
  .escala-cheia { fill: none; stroke: var(--acc-hi); stroke-width: 6; }
  .ponta-brilho { fill: url(#gPonta); }
  .ponta.regen .ponta-brilho { fill: url(#gPontaRegen); }
  .ponto-g-brilho { fill: url(#gPonta); opacity: 0.8; }
  .ponto-g-miolo { fill: var(--acc-hi); }
  .marcador-traco { stroke: #fff; stroke-width: 4; stroke-linecap: round; }
  .cabine-cheia { fill: none; stroke: #f0f0f5; stroke-width: 6; }
  /* O marcador gira, as pontas e o ponto G andam: um transform por atualização, nada de
     reescrever geometria. */
  .gira, .ponta, .ponto-g { will-change: transform; }

  /* ---------- Texto ---------- */
  .abs { position: absolute; }
  .num { display: inline-block; transform: skewX(-10deg); font-weight: 500; }
  .cinza { color: var(--label); }

  /* Topo */
  #placa {
    position: absolute; left: 651px; top: 89px; width: 64px; height: 64px;
    border: 7px solid #e3202b; border-radius: 50%; background: #fff;
    display: flex; align-items: center; justify-content: center;
    color: #111; font-size: 30px; font-weight: 700; letter-spacing: -1px;
  }
  #placa.off { visibility: hidden; }

  #odo { position: absolute; left: 736px; top: 94px; width: 130px; text-align: center; }
  #odo .rot { font-size: 26px; color: var(--label); line-height: 30px; }
  #odo .val { font-size: 25px; line-height: 34px; }
  #odo .val small { font-size: 16px; color: var(--ink-dim); margin-left: 4px; }
  /* Seis dígitos (998.877) encostariam na velocidade de três dígitos. */
  #odo.longo .val { font-size: 20px; }

  #velocidade {
    position: absolute; left: 760px; top: 66px; width: 400px; text-align: center;
    font-size: 116px; line-height: 124px; letter-spacing: -1px;
  }
  #velValor, #giroValor { font-weight: 300; transform: skewX(-12deg); }
  #giroValor { font-weight: 400; }
  #kmh { position: absolute; left: 910px; top: 178px; width: 100px; text-align: center; font-size: 18px; color: var(--ink-dim); }

  /* Centro */
  #giro {
    position: absolute; left: 760px; top: 466px; width: 400px; text-align: center;
    font-size: 90px; line-height: 92px; letter-spacing: -1px;
  }
  #giroUn { position: absolute; left: 910px; top: 560px; width: 100px; text-align: center; font-size: 18px; color: var(--ink-dim); }
  #midia {
    position: absolute; left: 700px; top: 426px; width: 520px; text-align: center;
    font-size: 21px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #midia.vazio, body.projetando #midia { visibility: hidden; }

  #modo {
    position: absolute; left: 834px; top: 594px; width: 252px; height: 66px; box-sizing: border-box;
    border: 2px solid rgba(125, 170, 255, 0.75); border-radius: 9px;
    background: linear-gradient(to bottom, rgba(40, 66, 130, 0.88), rgba(16, 30, 70, 0.9));
    text-align: center;
  }
  #modoNome {
    display: block; margin-top: 6px; font-size: 30px; line-height: 34px; color: #fff;
    font-family: 'Noto Serif', Georgia, 'Times New Roman', serif;
  }
  #modoPips { display: flex; justify-content: center; margin-top: 6px; }
  #modoPips i { display: block; width: 28px; height: 6px; margin: 0 5px; border-radius: 2px; background: rgba(226, 230, 240, 0.85); }
  #modoPips i.on { background: #e8286f; box-shadow: 0 0 8px rgba(232, 40, 111, 0.8); }

  /* Rodapé */
  /* Combustível e relógio: a luz de combustível baixo do painel de fábrica fica em x 346-385,
     y 662-707, por cima do tema (docs/operations/mapa-de-luzes-do-painel.md), e caía no meio da
     barra e da autonomia. A barra ficou mais curta (4 segmentos de 58 em vez de 76) e acaba antes
     da luz, com o "0", a autonomia no meio e o "1" nas mesmas posições relativas; o relógio vem
     logo depois da luz, que fica no vão entre os dois. */
  #comb { position: absolute; left: 86px; top: 636px; width: 248px; height: 64px; }
  #comb .lim { position: absolute; top: 8px; font-size: 24px; }
  #comb .lim.zero { left: 4px; }
  #comb .lim.um { right: 4px; }
  #comb svg { position: absolute; left: 52px; top: 6px; width: 30px; height: 34px; color: var(--ink); }
  #autonomia { position: absolute; left: 92px; top: 2px; font-size: 32px; }
  #autonomia small { font-size: 18px; color: var(--ink-dim); margin-left: 6px; }
  .barra-comb { position: absolute; left: 2px; top: 50px; width: 244px; height: 6px; }
  .barra-comb i { position: absolute; top: 0; width: 58px; height: 6px; border-radius: 1px; }
  .barra-comb.trilho i { background: rgba(255, 255, 255, 0.2); }
  .barra-comb.cheia i { background: #f1f1f5; }
  .barra-comb i:nth-child(1) { left: 0; }
  .barra-comb i:nth-child(2) { left: 62px; }
  .barra-comb i:nth-child(3) { left: 124px; }
  .barra-comb i:nth-child(4) { left: 186px; }
  #combCheia { clip-path: inset(0 100% 0 0); }
  #comb.baixo #combCheia i { background: #ffae1f; }

  #relogio { position: absolute; left: 400px; top: 668px; font-size: 36px; line-height: 40px; }

  #ev {
    position: absolute; left: 1094px; top: 672px; width: 38px; height: 34px; border-radius: 3px;
    background: #2f7dff; color: #fff; font-size: 17px; font-weight: 800; line-height: 34px; text-align: center;
    visibility: hidden;
  }
  #ev.on { visibility: visible; }

  #temp { position: absolute; left: 1180px; top: 668px; width: 196px; text-align: right; font-size: 36px; line-height: 40px; }

  #energia { position: absolute; left: 1392px; top: 640px; width: 302px; height: 60px; }
  #energia .rot { position: absolute; top: 18px; font-size: 14px; font-weight: 700; letter-spacing: 1px; }
  #energia .rot.pot { left: 18px; color: var(--power); }
  #energia .rot.rec { right: 14px; color: var(--charge); }
  #modoEnergia {
    position: absolute; left: 101px; top: 4px; width: 100px; text-align: center;
    font-size: 30px; font-weight: 700; letter-spacing: 2px; color: transparent;
    -webkit-text-stroke: 1.6px var(--charge);
  }
  .en-trilho { position: absolute; top: 46px; height: 5px; background: rgba(210, 210, 225, 0.35); }
  .en-trilho.pot { left: 2px; width: 144px; }
  .en-trilho.rec { left: 156px; width: 144px; }
  .en-trilho b { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform: scaleX(0); transition: transform 0.15s linear; }
  .en-trilho.pot b { background: var(--power); transform-origin: 100% 50%; }
  .en-trilho.rec b { background: var(--charge); transform-origin: 0 50%; }

  #prog {
    position: absolute; left: 1708px; top: 672px; width: 50px; height: 34px; box-sizing: border-box; border-radius: 5px;
    border: 2px solid #ff9a1a; background: linear-gradient(#ffae3a, #e27a00); color: #1b0e00;
    font-size: 24px; font-weight: 800; line-height: 30px; text-align: center; visibility: hidden;
  }
  #prog.on { visibility: visible; }
  #prog.eco { border-color: #2ed37a; background: linear-gradient(#5be39a, #1aa35a); }

  #cambio { position: absolute; left: 1770px; top: 612px; width: 110px; height: 100px; }
  #cambioLista { position: absolute; left: 4px; top: 4px; width: 30px; text-align: center; font-size: 24px; line-height: 31px; color: var(--label); }
  #cambioLista span { display: block; }
  #cambioAtual { position: absolute; left: 36px; top: 20px; width: 60px; text-align: center; font-size: 58px; line-height: 64px; font-weight: 500; }

  /* Círculos laterais: números. Os círculos encolheram e mudaram de centro para (153, 420) e
     (1767, 420) por causa das luzes do painel de fábrica (ver o gerador); o que fica dentro deles
     acompanha na mesma escala (~0,61). */
  #gValor { position: absolute; left: 53px; top: 511px; width: 200px; text-align: center; font-size: 20px; color: var(--ink-dim); }
  #consumo { position: absolute; left: 1667px; top: 363px; width: 200px; text-align: center; font-size: 36px; line-height: 40px; }
  #consumoUn { position: absolute; left: 1717px; top: 404px; width: 100px; text-align: center; font-size: 14px; color: var(--ink-dim); }
  #cabine { position: absolute; left: 1741px; top: 456px; width: 70px; height: 28px; }
  #cabine svg { position: absolute; left: 0; top: 1px; width: 12px; height: 24px; color: var(--ink); }
  #cabineValor { position: absolute; left: 16px; top: 2px; font-size: 18px; }

  @media (prefers-reduced-motion: reduce) { .en-trilho b { transition: none; } }
</style>
</head>

<body>

<div id="bg">
  <svg id="fundo" viewBox="0 0 1920 720" preserveAspectRatio="none" aria-hidden="true">
    <!-- GERADO:fundo:inicio -->
    <defs>
      <linearGradient id="gCeu" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="720">
        <stop offset="0" stop-color="#040306"/><stop offset="0.25" stop-color="#0a0710"/>
        <stop offset="0.39" stop-color="#1d1330"/><stop offset="0.455" stop-color="#3b2854"/>

      </linearGradient>

      <radialGradient id="gLuzDoTunel">

        <stop offset="0.4" stop-color="#cdb8ea" stop-opacity="0.55"/><stop offset="0.68" stop-color="#6e4e92" stop-opacity="0.18"/>

      </radialGradient>
      <linearGradient id="gTeto" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="250">
        <stop offset="0" stop-color="#000" stop-opacity="0.9"/><stop offset="0.75" stop-color="#000" stop-opacity="0.55"/>

      </linearGradient>
      <linearGradient id="gHorizonte" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="gPontos" gradientUnits="userSpaceOnUse" x1="0" y1="120" x2="0" y2="640">
        <stop class="s-acc" offset="0" stop-opacity="0"/><stop class="s-acc" offset="0.22" stop-opacity="0.5"/>
        <stop class="s-acc-hi" offset="0.48" stop-opacity="1"/><stop class="s-acc" offset="0.78" stop-opacity="0.75"/>

      </linearGradient>
      <linearGradient id="gQuente" gradientUnits="userSpaceOnUse" x1="0" y1="215" x2="0" y2="515">
        <stop class="s-acc" offset="0" stop-opacity="0"/><stop class="s-acc-hi" offset="0.2" stop-opacity="0.95"/>
        <stop offset="0.5" stop-color="#fff4f0"/><stop class="s-acc-hi" offset="0.78" stop-opacity="0.95"/>
        <stop class="s-acc" offset="1" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="gNucleo" gradientUnits="userSpaceOnUse" x1="0" y1="235" x2="0" y2="470">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.3" stop-color="#fff"/>

    modoNome: $('modoNome'), modoPips: $('modoPips').children, prog: $('prog'),
    comb: $('comb'), combCheia: $('combCheia'), autonomiaValor: $('autonomiaValor'),
    relogio: $('relogio'), ev: $('ev'), tempValor: $('tempValor'),
    modoEnergia: $('modoEnergia'), barraPot: $('barraPot'), barraRec: $('barraRec'),
    cambioLista: $('cambioLista'), cambioAtual: $('cambioAtual'),
  };

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function numero(v) { const n = parseFloat(v); return Number.isFinite(n) ? n : null; }
  function ligado(v) {
    return v === true || ['1', 'true', 'on', 'yes', 'ligado']
      .indexOf(String(v == null ? '' : v).trim().toLowerCase()) >= 0;
  }
  function milhar(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function virgula(n, casas) { return n.toFixed(casas).replace('.', ','); }

  // ----- Suavização -----
  // Filtro criticamente amortecido de segunda ordem sobre o VALOR (não transição de desenho), o
  // mesmo do Stuttgart NTG 5.5: `ms` é o tempo para andar 95% de um degrau. Solução exata do
  // passo, então um quadro longo (rAF estrangulado) não desestabiliza; acima de 400 ms crava.
  function canal(ms, eps) { return { alvo: null, atual: null, taxa: 0, omega: 4.744 / Math.max(0.001, ms / 1000), eps: eps }; }
  function mirar(c, v) {
    if (c.atual === null) { c.atual = v; c.alvo = v; c.taxa = 0; return; }
    c.alvo = v;
  }
  function passo(c, dt) {
    if (c.atual === null || (c.atual === c.alvo && c.taxa === 0)) return false;
    if (dt > 0.4) { c.atual = c.alvo; c.taxa = 0; return false; }
    const e0 = c.atual - c.alvo;
    const b = c.taxa + c.omega * e0;
    const k = Math.exp(-c.omega * dt);
    c.atual = c.alvo + (e0 + b * dt) * k;
    c.taxa = (c.taxa - c.omega * b * dt) * k;
    if (Math.abs(c.alvo - c.atual) <= c.eps && Math.abs(c.taxa) <= c.omega * c.eps) {
      c.atual = c.alvo; c.taxa = 0; return false;
    }
    return true;
  }
  const C = {
    giro: canal(320, 0.001),
    bateria: canal(500, 0.001),
    potencia: canal(260, 0.001),
    g: canal(380, 0.002),
    consumo: canal(600, 0.001),
    cabine: canal(900, 0.001),
  };
  const CANAIS = Object.keys(C).map((k) => C[k]);

  // ----- Desenho (só escreve no DOM quando o valor desenhado muda) -----
  const escrito = {};
  function mudou(chave, valor) { if (escrito[chave] === valor) return false; escrito[chave] = valor; return true; }

  function desenharGiro(f) {
    const deg = (GEO.cunha.ini + clamp(f, 0, 1) * (GEO.cunha.fim - GEO.cunha.ini)).toFixed(1);
    if (!mudou('giro', deg)) return;
    els.cunha.setAttribute('transform', 'rotate(' + deg + ' ' + GEO.cunha.cx + ' ' + GEO.cunha.cy + ')');
    els.bordaQuente.setAttribute('transform', 'rotate(' + deg + ' ' + GEO.cunha.cx + ' ' + GEO.cunha.cy + ')');
  }

  // O comprimento do trilho é constante: mede uma vez e guarda (ler depois de escrever forçaria
  // layout síncrono a cada quadro).
  const comprimentos = new WeakMap();
  function comprimento(el) {
    let len = comprimentos.get(el);
    if (len === undefined) {
      len = el.getTotalLength();
      comprimentos.set(el, len);
      el.style.strokeDasharray = len.toFixed(1) + ' ' + (len + 10).toFixed(1);
    }
    return len;
  }
  function desenharEscala(chave, trilho, ponta, f) {
    const v = clamp(f, 0, 1);
    const q = Math.round(v * 400);
    if (!mudou(chave, q)) return;
    const len = comprimento(trilho);
    trilho.style.strokeDashoffset = (len * (1 - q / 400)).toFixed(1);
    const p = trilho.getPointAtLength(len * q / 400);
    ponta.style.transform = 'translate(' + p.x.toFixed(1) + 'px, ' + p.y.toFixed(1) + 'px)';
  }

  function desenharG(g) {
    const y = clamp(g * GEO.g.alcance, -GEO.g.alcance * 0.98, GEO.g.alcance * 0.98).toFixed(1);
    if (mudou('g', y)) els.pontoG.style.transform = 'translate(0px, ' + y + 'px)';
    const txt = virgula(Math.abs(g) < 0.005 ? 0 : Math.abs(g), 2) + ' g';
    if (mudou('gTxt', txt)) els.gValor.textContent = txt;
  }

  function desenharConsumo(f) {
    const deg = (clamp(f, 0, 1) * 180).toFixed(1);
    if (!mudou('consumo', deg)) return;
    els.marcadorConsumo.setAttribute('transform', 'rotate(' + deg + ' ' + GEO.dados.cx + ' ' + GEO.dados.cy + ')');
  }

  function desenharCabine(f) {
    const q = Math.round(clamp(f, 0, 1) * 300);
    if (!mudou('cabine', q)) return;
    const len = comprimento(els.arcoCabine);
    els.arcoCabine.style.strokeDashoffset = (len * (1 - q / 300)).toFixed(1);
  }

  // ----- Estado bruto (texto) -----
  const est = {
    velocidade: null, rpm: 0, potencia: 0,
    pronto: null, prontoPeloReady: false, motorGirando: false,
    tempExt: null, tempInt: null, fahrenheit: false,
    midia: { titulo: '', artista: '', tocando: false, radio: '' },
    placaValor: null, placaOk: false,
  };

  // Motor a combustão girando, com histerese (o engine_state é ignição, não motor: ver o guia).
  const ICE_LIGA = 400, ICE_DESLIGA = 150;
  function atualizarEv() {
    const pronto = est.pronto === true;
    els.ev.classList.toggle('on', pronto && !est.motorGirando);
  }

  function formatarTemp(c) {
    const v = est.fahrenheit ? c * 9 / 5 + 32 : c;
    const txt = virgula(Math.abs(v), 1);
    return (v < -0.05 ? '−' : '') + txt + (est.fahrenheit ? ' °F' : ' °C');
  }
  function desenharTemps() {
    if (est.tempExt !== null) els.tempValor.textContent = formatarTemp(est.tempExt);
    if (est.tempInt !== null) {
      const v = est.fahrenheit ? est.tempInt * 9 / 5 + 32 : est.tempInt;
      els.cabineValor.textContent = Math.round(v) + '°';
      mirar(C.cabine, (est.tempInt - GEO.cabine.min) / (GEO.cabine.max - GEO.cabine.min));
      scheduleRender();
    }
  }

  function atualizarMidia() {
    const m = est.midia;
    let txt = '';
    if (m.tocando && m.titulo) txt = '♪  ' + [m.artista, m.titulo].filter((s) => s && s.trim()).join(' – ');
    else if (m.radio) txt = '♪  ' + m.radio;
    els.midia.textContent = txt;
    els.midia.classList.toggle('vazio', !txt);
  }
  function formatarRadio(raw) {
    const freq = Number(String(raw || '').split(',')[0]);
    if (!Number.isFinite(freq) || freq <= 0) return '';
    if (freq >= 3000) return virgula(freq / 1000, 1) + ' FM';
    return Math.round(freq) + ' AM';
  }

  // Consumo instantâneo: "{métrica,consumo}" ou número solto, como o NTG clássico. Métrica 1 =
  // L/100 km (vira km/l); métrica 4 = parado, em L/h, sem distância: não existe km/l.
  function consumoKml(raw) {
    const s = raw == null ? '' : String(raw);
    let metrica = 1;
    let consumo = 0;
    if (s.charAt(0) === '{' && s.charAt(s.length - 1) === '}' && s.indexOf(',') > 0) {
      const p = s.slice(1, -1).split(',');
      metrica = parseFloat(p[0]) || 0;
      consumo = parseFloat(p[1]) || 0;
    } else {
      consumo = parseFloat(s) || 0;
    }
    if (metrica === 4 || consumo <= 0) return null;
    return Math.trunc((100 / consumo) * 10) / 10;
  }

  function atualizarPlaca() {
    const ok = est.placaOk && est.placaValor !== null && est.placaValor > 0;
    els.placa.classList.toggle('off', !ok);
    if (ok) els.placaValor.textContent = Math.round(est.placaValor);
  }

  function desenharEnergia(pct) {
    const p = clamp(pct, -100, 100);
    const pot = p > 0 ? (p / 100).toFixed(3) : '0';
    const rec = p < 0 ? (-p / 100).toFixed(3) : '0';
    if (mudou('barraPot', pot)) els.barraPot.style.transform = 'scaleX(' + pot + ')';
    if (mudou('barraRec', rec)) els.barraRec.style.transform = 'scaleX(' + rec + ')';
    const regen = p < -3;
    if (mudou('regen', regen)) els.pontaD.classList.toggle('regen', regen);
  }

  // ----- Câmbio e modos -----
  const GEAR_LABELS = { '0': 'N', '1': 'N', '2': 'D', '3': 'P', '4': 'R' };
  const ORDEM_CAMBIO = ['R', 'N', 'D', 'P'];
  function desenharCambio(letra) {
    els.cambioAtual.textContent = letra;
    const resto = ORDEM_CAMBIO.filter((l) => l !== letra).slice(0, 3);
    els.cambioLista.innerHTML = resto.map((l) => '<span>' + l + '</span>').join('');
  }

  const DRIVE_MODE_LABELS = { '0': 'Normal', '1': 'Sport', '2': 'Eco', '3': 'Neve', '4': 'Areia', '5': 'Lama', '11': 'AWD' };
  // Seis traços, como os seis programas do seletor da referência.
  const PIP_DO_MODO = { '2': 0, '0': 1, '1': 2, '3': 3, '4': 4, '5': 5 };
  const EV_MODE_LABELS = { '0': 'HEV', '1': 'EVP', '3': 'EV' };
  let modoAtual = '0';
  function desenharModo(raw) {
    modoAtual = String(parseInt(raw, 10));
    els.modoNome.textContent = DRIVE_MODE_LABELS[modoAtual] || 'Normal';
    const pip = PIP_DO_MODO[modoAtual];
    for (let i = 0; i < els.modoPips.length; i++) els.modoPips[i].classList.toggle('on', i === pip);
    els.prog.classList.toggle('on', modoAtual === '1' || modoAtual === '2');
    els.prog.classList.toggle('eco', modoAtual === '2');
    els.prog.textContent = modoAtual === '2' ? 'E' : 'S';
    aplicarCorDoPainel();
  }

  // ----- Cor do painel (ajuste do tema) -----
  const CORES = { vermelho: '#ff1f14', azul: '#1f7dff', ambar: '#ff8a00' };
  const COR_DO_MODO = { '2': '#19c37d', '0': '#1f7dff', '1': '#ff1f14', '3': '#5ccaff', '4': '#ffae2b', '5': '#ff7a1a', '11': '#ff1f14' };
  let preferenciaDeCor = 'vermelho';
  let corAtual = null;
  function misturar(hex, com, t) {
    const a = parseInt(hex.slice(1), 16);
    const b = parseInt(com.slice(1), 16);
    const canalDe = (n, s) => (n >> s) & 255;
    const mix = (s) => Math.round(canalDe(a, s) + (canalDe(b, s) - canalDe(a, s)) * t);
    return '#' + ((1 << 24) | (mix(16) << 16) | (mix(8) << 8) | mix(0)).toString(16).slice(1);
  }
  function aplicarCorDoPainel() {
    const hex = preferenciaDeCor === 'modo' ? (COR_DO_MODO[modoAtual] || CORES.vermelho) : CORES[preferenciaDeCor];
    if (hex === corAtual) return;
    corAtual = hex;
    const r = document.documentElement.style;
    r.setProperty('--acc', hex);
    r.setProperty('--acc-hi', misturar(hex, '#ffffff', 0.42));
    r.setProperty('--acc-lo', misturar(hex, '#000000', 0.5));
  }
  function lerPreferencias() {
    try {
      if (!window.Android || typeof window.Android.getPreference !== 'function') return;
      const modo = String(window.Android.getPreference('displayMode', 'Dia') || '');
      document.body.classList.toggle('night-mode', modo === 'Noite');
      const cor = String(window.Android.getPreference('accentMode', 'Vermelho') || '').toLowerCase();
      const pref = cor.indexOf('azul') >= 0 ? 'azul'
        : (cor.indexOf('mbar') >= 0) ? 'ambar'
        : (cor.indexOf('seguir') >= 0 || cor.indexOf('modo') >= 0) ? 'modo'
        : 'vermelho';
      if (pref !== preferenciaDeCor) { preferenciaDeCor = pref; aplicarCorDoPainel(); }
    } catch (e) { /* ignore */ }
  }

  // ----- Força G longitudinal -----
  // Regressão linear da velocidade nos últimos 700 ms. O projetor só manda a velocidade quando
  // ela MUDA; parado ou em velocidade constante não chega nada, então enquanto houver amostra na
  // janela um temporizador repete a última leitura, e a aceleração cai a zero sozinha.
  const amostras = [];
  let temporizadorG = 0;
  function amostrarVelocidade(kmh, t) {
    amostras.push([t, kmh / 3.6]);
    while (amostras.length && t - amostras[0][0] > 700) amostras.shift();
    const n = amostras.length;
    if (n >= 2 && t - amostras[0][0] >= 150) {
      const t0 = amostras[0][0];
      let st = 0, sv = 0, stt = 0, stv = 0;
      for (let i = 0; i < n; i++) {
        const x = (amostras[i][0] - t0) / 1000;
        st += x; sv += amostras[i][1]; stt += x * x; stv += x * amostras[i][1];
      }
      const den = n * stt - st * st;
      if (den > 1e-6) mirar(C.g, clamp(((n * stv - st * sv) / den) / 9.81, -1.2, 1.2));
    }
    clearTimeout(temporizadorG);
    // Janela toda na mesma velocidade: aceleração zero, e o temporizador para (parado ou em
    // cruzeiro o painel não acorda quatro vezes por segundo à toa).
    const constante = amostras.every((a) => a[1] === amostras[0][1]);
    if (constante) {
      amostras.splice(0, amostras.length - 1);
      if (C.g.alvo !== null && C.g.alvo !== 0) mirar(C.g, 0);
      return;
    }
    temporizadorG = setTimeout(() => {
      if (est.velocidade === null) return;
      amostrarVelocidade(est.velocidade, performance.now());
      scheduleRender();
    }, 250);
  }

  function tickClock() {
    const d = new Date();
    els.relogio.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tickClock();
  setInterval(tickClock, 5000);

  // ----- Coalescência de render -----
  // Cada chave chega num evaluateJavascript separado; desenhar uma vez por quadro. Os canais
  // suavizados pedem o próximo quadro só enquanto ainda estão andando.
  let renderScheduled = false;
  let renderFallbackTimer = 0;
  let ultimoQuadro = 0;
  function flushRender(ts) {
    if (!renderScheduled) return;
    renderScheduled = false;
    clearTimeout(renderFallbackTimer);
    const agora = typeof ts === 'number' && ts > 0 ? ts : performance.now();
    const dt = ultimoQuadro ? (agora - ultimoQuadro) / 1000 : 0;
    ultimoQuadro = agora;
    let andando = false;
    for (let i = 0; i < CANAIS.length; i++) if (passo(CANAIS[i], dt)) andando = true;

    if (est.velocidade !== null) {
      const v = String(Math.round(est.velocidade));
      if (mudou('vel', v)) els.velValor.textContent = v;
    }
    const rpm = String(Math.round(est.rpm / 10) * 10);
    if (mudou('rpm', rpm)) els.giroValor.textContent = rpm;
    if (C.giro.atual !== null) desenharGiro(C.giro.atual);
    if (C.bateria.atual !== null) desenharEscala('bat', els.escalaE, els.pontaE, C.bateria.atual);
    if (C.potencia.atual !== null) desenharEscala('pot', els.escalaD, els.pontaD, Math.max(0, C.potencia.atual));
    if (C.g.atual !== null) desenharG(C.g.atual);
    if (C.consumo.atual !== null) desenharConsumo(C.consumo.atual);
    if (C.cabine.atual !== null) desenharCabine(C.cabine.atual);

    if (andando) scheduleRender();
    else ultimoQuadro = 0;
  }
  function scheduleRender() {
    if (renderScheduled) return;
    renderScheduled = true;
    requestAnimationFrame(flushRender);
    // Rede de segurança: com o WebView oculto o rAF não dispara; os valores não podem congelar.
    renderFallbackTimer = setTimeout(flushRender, 120);
  }

  function handleTelemetry(key, raw) {
    switch (key) {
      case 'car.basic.vehicle_speed': {
        const v = numero(raw);
        est.velocidade = v === null ? 0 : Math.max(0, v);
        amostrarVelocidade(est.velocidade, performance.now());
        scheduleRender();
        break;
      }
      case 'car.basic.engine_speed': {
        const rpm = Math.max(0, numero(raw) || 0);
        est.rpm = rpm;
        if (!est.motorGirando && rpm >= ICE_LIGA) est.motorGirando = true;
        else if (est.motorGirando && rpm <= ICE_DESLIGA) est.motorGirando = false;
        atualizarEv();
        mirar(C.giro, clamp(rpm / GEO.rpmMax, 0, 1));
        scheduleRender();
        break;
      }
      case 'car.ev_info.energy_output_percentage': {
        const p = numero(raw) || 0;
        est.potencia = p;
        mirar(C.potencia, clamp(p / 100, -1, 1));
        desenharEnergia(p);
        scheduleRender();
        break;
      }
      case 'car.ev_info.cur_battery_power_percentage': {
        const pct = numero(raw);
        if (pct !== null) { mirar(C.bateria, clamp(pct / 100, 0, 1)); scheduleRender(); }
        break;
      }
      case 'car.basic.remain_fuel_percentage': {
        const pct = clamp(numero(raw) || 0, 0, 100);
        els.combCheia.style.clipPath = 'inset(0 ' + (100 - pct).toFixed(1) + '% 0 0)';
        els.comb.classList.toggle('baixo', pct < 12);
        break;
      }
      case 'car.ev_info.fuel_mode_remain_odometer': {
        const km = numero(raw);
        els.autonomiaValor.textContent = km === null ? '---' : Math.round(km);
        break;
      }
      case 'car.basic.total_odometer': {
        const km = numero(raw);
        const txt = km === null ? '---' : milhar(Math.round(km));
        els.odoValor.textContent = txt;
        els.odo.classList.toggle('longo', txt.length > 6);
        break;
      }
      case 'car.basic.gear_status':
        desenharCambio(GEAR_LABELS[String(parseInt(raw, 10))] || 'N');
        break;
      case 'car.drive_setting.drive_mode':
        desenharModo(raw);
        break;
      case 'car.ev_setting.power_model_config':
        els.modoEnergia.textContent = EV_MODE_LABELS[String(raw)] || 'HEV';
        break;
      case 'car.basic.outside_temp': {
        const t = numero(raw);
        if (t !== null) { est.tempExt = t; desenharTemps(); }
        break;
      }
      case 'car.basic.inside_temp': {
        const t = numero(raw);
        if (t !== null) { est.tempInt = t; desenharTemps(); }
        break;
      }
      case 'car.configure.default_temp_unit':
        est.fahrenheit = String(raw).trim() === '1';
        desenharTemps();
        break;
      case 'car.basic.instant_fuel_consumption': {
        const kml = consumoKml(raw);
        els.consumoValor.textContent = kml === null ? '--' : virgula(Math.min(kml, 99.9), 1);
        mirar(C.consumo, kml === null ? 0 : clamp(kml / GEO.consumoMax, 0, 1));
        scheduleRender();
        break;
      }
      case 'car.basic.head_light_status': {
        // O app entrega o estado já resolvido (HeadlightPolicy); aqui é só ligado/desligado.
        const aceso = ligado(raw);
        document.body.classList.toggle('mode-headlight', aceso);
        break;
      }
      // READY vem de driving_ready_state ("1" pronto). O engine_state é ignição e, lido no carro
      // em 30/09, vinha 11 parado em READY: por ele (=== '13') o READY apagava com o carro pronto.
      case 'car.basic.driving_ready_state': {
        const s = String(raw).trim();
        est.prontoPeloReady = s !== '';
        est.pronto = s === '1' ? true : (s === '0' || s === '-1') ? false : null;
        atualizarEv();
        break;
      }
      // Reserva para um app sem driving_ready_state no contrato (anterior à Alpha 9.4).
      case 'car.basic.engine_state': {
        if (est.prontoPeloReady) break;
        const n = parseInt(raw, 10);
        est.pronto = n === 11 || n === 13;
        atualizarEv();
        break;
      }
      case 'car.map.tsr.nav_speed_limit':
        est.placaValor = numero(raw);
        atualizarPlaca();
        break;
      case 'car.map.tsr.nav_speed_limit_sign_status':
        est.placaOk = ligado(raw);
        atualizarPlaca();
        break;
      case 'app.media.title':
        est.midia.titulo = raw ? String(raw) : '';
        atualizarMidia();
        break;
      case 'app.media.artist':
        est.midia.artista = raw ? String(raw) : '';
        atualizarMidia();
        break;
      case 'app.media.state':
        est.midia.tocando = String(raw) === 'playing';
        atualizarMidia();
        break;
      case 'sys.radio.cur_channel_info':
        est.midia.radio = formatarRadio(raw);
        atualizarMidia();
        break;
      default:
        break;
    }
  }

  // ----- Ceder a tela -----
  // Só projeção de verdade (CarPlay/Android Auto/espelhamento) tira o tema da frente. Aviso do
  // carro não: ele é desenhado pelo próprio tema (ver desenharAvisos), como no NTG clássico.
  const projectionState = { carPlayInDash: false, projectionMirrorInDash: false, projectionPreparingD3: false };
  function applyYieldToCar() {
    const yielding = projectionState.carPlayInDash ||
      projectionState.projectionMirrorInDash || projectionState.projectionPreparingD3;
    els.app.classList.toggle('hidden', yielding);
    document.body.classList.toggle('yield-to-car', yielding);
  }

  // ----- Vão da projeção da central -----
  // O miolo do túnel: entre as meias-luas, da linha da velocidade ao seletor de modo. Declarar
  // faz o app pôr o vídeo POR BAIXO desta página; o fundo abre o buraco (aplicarVaoDaProjecao) e
  // as meias-luas, a velocidade e a rotação continuam desenhando por cima.
  // Alpha 9.5: mais largo, até embaixo das duas meias-luas vermelhas (opacas), como no NTG 5.5.
  const PROJ_BOX = { x: 520, y: 196, w: 880, h: 420 };
  const PROJ_PENA_X = 96;
  const PROJ_PENA_Y = 56;

  function sabeRecortarOFundo() {
    try {
      if (!window.CSS || typeof window.CSS.supports !== 'function') return false;
      const g = 'linear-gradient(to right, #000 0px, transparent 10px)';
      return window.CSS.supports('-webkit-mask-image', g) || window.CSS.supports('mask-image', g);
    } catch (e) { return false; }
  }
  let recortaOFundo = null;
  function declararVaoDaProjecao() {
    if (recortaOFundo === null) {
      recortaOFundo = sabeRecortarOFundo();
      if (!recortaOFundo) console.warn('[MBUX] sem suporte a mascara: a projecao vai por cima do tema');
    }
    if (!recortaOFundo) return;
    try {
      if (window.Android && typeof window.Android.setProjectionBox === 'function') {
        window.Android.setProjectionBox(PROJ_BOX.x, PROJ_BOX.y, PROJ_BOX.w, PROJ_BOX.h);
      }
    } catch (e) { /* ponte antiga: sem declaração, o app volta a varrer o DOM */ }
  }
  function aplicarVaoDaProjecao(valor) {
    const bg = els.bg;
    const n = String(valor == null ? '' : valor).split(',');
    const x = parseInt(n[0], 10), y = parseInt(n[1], 10);
    const l = parseInt(n[2], 10), a = parseInt(n[3], 10);
    if (n.length < 4 || !(l > 0) || !(a > 0)) {
      bg.style.webkitMaskImage = '';
      bg.style.maskImage = '';
      document.body.classList.remove('projetando');
      return;
    }
    const L = x, R = x + l, T = y, B = y + a;
    const px = Math.min(PROJ_PENA_X, Math.floor(l / 3));
    const py = Math.min(PROJ_PENA_Y, Math.floor(a / 3));
    const pe = L <= 0 ? 0 : px, pd = R >= 1920 ? 0 : px;
    const pt = T <= 0 ? 0 : py, pb = B >= 720 ? 0 : py;
    const gx = 'linear-gradient(to right, #000 ' + L + 'px, transparent ' + (L + pe) + 'px, transparent ' + (R - pd) + 'px, #000 ' + R + 'px)';
    const gy = 'linear-gradient(to bottom, #000 ' + T + 'px, transparent ' + (T + pt) + 'px, transparent ' + (B - pb) + 'px, #000 ' + B + 'px)';
    const veu = $('projscrim');
    if (veu) {
      veu.style.left = L + 'px';
      veu.style.top = T + 'px';
      veu.style.width = l + 'px';
      veu.style.height = a + 'px';
      const mv = 'linear-gradient(to right, transparent 0px, #000 ' + pe + 'px, #000 ' + (l - pd) + 'px, transparent ' + l + 'px)';
      veu.style.webkitMaskImage = mv;
      veu.style.maskImage = mv;
    }
    bg.style.webkitMaskImage = gx + ', ' + gy;
    bg.style.maskImage = gx + ', ' + gy;
    document.body.classList.add('projetando');
  }

  const SUBSCRIBE_KEYS = [
    'car.basic.vehicle_speed',
    'car.basic.engine_speed',
    'car.ev_info.energy_output_percentage',
    'car.ev_info.cur_battery_power_percentage',
    'car.basic.remain_fuel_percentage',
    'car.ev_info.fuel_mode_remain_odometer',
    'car.basic.total_odometer',
    'car.basic.gear_status',
    'car.drive_setting.drive_mode',
    'car.ev_setting.power_model_config',
    'car.basic.outside_temp',
    'car.basic.inside_temp',
    'car.configure.default_temp_unit',
    'car.basic.instant_fuel_consumption',
    'car.basic.head_light_status',
    'car.basic.driving_ready_state',
    'car.basic.engine_state',
    'car.map.tsr.nav_speed_limit',
    'car.map.tsr.nav_speed_limit_sign_status',
    'app.media.title',
    'app.media.artist',
    'app.media.state',
    'sys.radio.cur_channel_info',
    'warningActive'
  ];

  // ===================== Simulação local (sem window.Android) =====================
  // ?photo=1 congela o quadro de demonstração; ?mode=Noite, ?cor=Azul|Âmbar|Seguir modo, ?farol=1
  // (modo farol), ?proj=1, ?regen=1 e ?g=0.3 exercitam o resto.
  function installMockBridge() {
    console.warn('[MBUX] window.Android ausente — usando simulação local para preview.');
    const q = new URLSearchParams(location.search);
    const foto = q.get('photo') === '1';
    window.Android = {
      getAvailableKeys: () => JSON.stringify(SUBSCRIBE_KEYS),
      subscribe: () => {}, unsubscribe: () => {},
      getCarData: () => '0', updateCarData: () => {},
      getPreference: (k, d) => {
        if (k === 'displayMode') return q.get('mode') || d;
        if (k === 'accentMode') return q.get('cor') || d;
        return d;
      },
      savePreference: () => {}, heartbeat: () => {}, triggerSystemAction: () => {},
      setAppDefaultDimensions: () => {}, setProjectionBox: () => {},
    };
    const regen = q.get('regen') === '1';
    const seed = {
      'car.basic.vehicle_speed': '72',
      'car.basic.engine_speed': '3100',
      'car.ev_info.energy_output_percentage': regen ? '-42' : '38',
      'car.ev_info.cur_battery_power_percentage': '71',
      'car.basic.remain_fuel_percentage': '58',
      'car.ev_info.fuel_mode_remain_odometer': '438',
      'car.basic.total_odometer': '18427',
      'car.basic.gear_status': '2',
      'car.drive_setting.drive_mode': q.get('dm') || '1',
      'car.ev_setting.power_model_config': '0',
      'car.basic.outside_temp': '25',
      'car.basic.inside_temp': '22',
      'car.basic.instant_fuel_consumption': '{1,7.4}',
      'car.basic.head_light_status': q.get('farol') === '1' ? '1' : '0',
      'car.basic.driving_ready_state': '1',
      'car.basic.engine_state': '11',
      'car.map.tsr.nav_speed_limit': '90',
      'car.map.tsr.nav_speed_limit_sign_status': '1',
      'app.media.state': 'playing',
      'app.media.artist': 'Elis Regina',
      'app.media.title': 'Águas de Março',
    };
    Object.keys(seed).forEach((k) => handleTelemetry(k, seed[k]));
    if (q.get('proj') === '1') window.control('projectionWindow', PROJ_BOX.x + ',' + PROJ_BOX.y + ',' + PROJ_BOX.w + ',' + PROJ_BOX.h);
    if (q.get('g')) { mirar(C.g, parseFloat(q.get('g')) || 0); }
    if (foto) return;

    let t = 0;
    let vel = 0;
    setInterval(() => {
      t += 0.1;
      const alvo = 90 + 80 * Math.sin(t / 6);
      vel += clamp(alvo - vel, -2.2, 1.6);
      const rpm = vel < 25 ? (Math.sin(t) > 0 ? 0 : 900) : 1200 + vel * 22 + 900 * Math.max(0, Math.sin(t * 1.3));
      handleTelemetry('car.basic.vehicle_speed', vel.toFixed(1));
      handleTelemetry('car.basic.engine_speed', String(Math.round(rpm)));
      handleTelemetry('car.ev_info.energy_output_percentage', String(Math.round(60 * Math.sin(t / 2))));
      handleTelemetry('car.basic.instant_fuel_consumption', '{1,' + (5 + 4 * Math.abs(Math.sin(t / 3))).toFixed(1) + '}');
    }, 100);
  }

  function initBridge() {
    if (!window.Android || typeof window.Android.subscribe !== 'function') {
      // Os canais que a simulação usa precisam existir antes dela.
      installHandlers();
      installMockBridge();
    } else {
      installHandlers();
    }

    try {
      if (window.Android && typeof window.Android.subscribe === 'function') {
        window.Android.subscribe(JSON.stringify(SUBSCRIBE_KEYS));
      }
      if (window.Android && typeof window.Android.setAppDefaultDimensions === 'function') {
        window.Android.setAppDefaultDimensions(560, 198, 800, 392); // área de app de antes: o vão largo da 9.5 é só da projeção
      }
      declararVaoDaProjecao();
      lerPreferencias();
    } catch (e) {
      console.error('[MBUX] bridge init failed:', e);
    }

    setInterval(() => {
      try {
        if (window.Android && typeof window.Android.heartbeat === 'function') window.Android.heartbeat();
      } catch (e) { /* ignore */ }
      lerPreferencias();
      // Redeclara o vão a cada batida: idempotente no app, e a rede se a carga se perder.
      try { declararVaoDaProjecao(); } catch (e) { /* ignore */ }
    }, 2000);
  }

  function installHandlers() {
    const prevOnDataChanged = window.onDataChanged;
    window.onDataChanged = function (key, value) {
      if (typeof prevOnDataChanged === 'function') {
        try { prevOnDataChanged(key, value); } catch (e) { console.error(e); }
      }
      handleTelemetry(key, value);
    };
    // O tema não se esconde no card 0 e não trata volante (é um mostrador passivo).
    window.onCardChanged = function () {};

    const prevControl = window.control;
    window.control = function (key, value) {
      if (typeof prevControl === 'function') {
        try { prevControl(key, value); } catch (e) { /* ignore */ }
      }
      if (Object.prototype.hasOwnProperty.call(projectionState, key)) {
        projectionState[key] = (value === true || value === 'true');
        applyYieldToCar();
        return;
      }
      if (key === 'projectionWindow') { aplicarVaoDaProjecao(value); return; }
    };
  }

  aplicarCorDoPainel();
  desenharCambio('P');
  desenharModo('0');
  initBridge();
})();
</script>
