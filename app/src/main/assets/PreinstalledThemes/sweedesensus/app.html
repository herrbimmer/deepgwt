<!doctype html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sweede Redondo</title>
<style>
  /* Painel no estilo Sensus, desenhado a partir da foto de referência: dois mostradores redondos
     de aro metálico, velocidade (0-260 km/h) à esquerda e potência híbrida à direita (OFF, READY,
     zona de carga, combustível e bateria embaixo). O ponteiro leva junto uma luz: o enchimento
     atrás dele e a face iluminada à frente. A mídia fica no centro, onde também aparece a projeção
     da central. A geometria sai de scripts/gerar-sweede-sensus.mjs; o que está entre os
     marcadores GERADO não se edita à mão.

     Nada tem camada composta (nenhum will-change): no WebView do app a página abre ainda sem
     tamanho, e camada criada ali sai na escala errada (visto no emulador na 8.6). O que anda é
     pintado dentro do SVG: o ponteiro e a luz giram por transform de grupo; o enchimento de base
     é uma pilha de fatias paradas que só trocam de visibilidade. */
  @font-face {
    font-family: 'RobotoV';
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
    src: url('RobotoV.woff') format('woff');
  }

  :root {
    --ink: #f2f3f4;
    --ink-dim: #8d9399;
    --ink-faint: rgba(236, 240, 244, 0.42);
    --label: #eef0f2;
    /* Tom do painel: o JS troca pela escolha em "Tom do painel" (ou pelo modo de condução).
       base = fim do enchimento; pico = a luz logo atrás do ponteiro; face = a luz à frente. */
    --base: #212529;
    --pico: #7c8c9a;
    --face: #4e565c;
    --azul-ev: #9fb2c2;
    --comb: #cfc5a6;
    --bat: #b4c3d0;
    --carga: #d9962e;
    --ok: #3ddc68;
    --ambar: #ffb020;
    --vermelho: #ff3b30;
    --night-tint: #ff9500;
  }

  /* Farol aceso: o app liga a classe e injeta --night-tint (Telas > cor do modo noturno). Os
     números passam para essa cor; a escala e a luz dos mostradores continuam como estão. */
  body.mode-headlight {
    --ink: var(--night-tint, #ff9500);
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 720px;
    /* Transparentes: o fundo opaco mora no #bg. Ceder a tela revela o que está atrás, e o vão da
       projeção (máscara no #bg) mostra o vídeo que o app põe por baixo da página. */
    background: transparent;
    overflow: hidden;
    font-family: 'RobotoV', Roboto, 'Segoe UI', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
  }

  #bg { position: absolute; left: 0; top: 0; width: 1920px; height: 720px; z-index: 0; background-color: #000; }
  #bg svg { position: absolute; left: 0; top: 0; width: 1920px; height: 720px; }
  #noite { position: absolute; left: 0; top: 0; width: 1920px; height: 720px; background: #000; opacity: 0; }
  body.night-mode #noite { opacity: 0.45; }
  body.yield-to-car #bg { opacity: 0; }

  #projscrim {
    position: absolute; display: none; z-index: 0; pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 70%, rgba(0,0,0,.6) 100%);
  }
  body.projetando #projscrim { display: block; }
  /* Alpha 9.5: FACE FUMÊ ENQUANTO PROJETA (como no NTG 5.5). Com o vão largo, a imagem passa por
     baixo dos mostradores; a faixa dos traços não é opaca e a deixaria vazar pelo anel. Um disco
     escuro no raio do aro (355 x 0,8 = 284) em volta de cada centro fecha o mostrador. */
  #projfumo {
    position: absolute; left: 0; top: 0; width: 1920px; height: 720px; display: none; z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(circle 292px at 426px 434px, rgba(8,8,10,.97) 0, rgba(8,8,10,.97) 284px, rgba(8,8,10,0) 292px),
      radial-gradient(circle 292px at 1494px 434px, rgba(8,8,10,.97) 0, rgba(8,8,10,.97) 284px, rgba(8,8,10,0) 292px);
  }
  body.projetando #projfumo { display: block; }

  /* Sem animação de abertura no #app (camada rasterizada na escala errada; ver a 8.6). */
  #app {
    position: absolute; left: 0; top: 0; width: 1920px; height: 720px; z-index: 1;
    transition: opacity 0.25s ease;
  }
  #app.hidden { opacity: 0; pointer-events: none; }

  #arte, #vivo, #frente { position: absolute; left: 0; top: 0; width: 1920px; height: 720px; }
  body.night-mode #arte { opacity: 0.8; }

  /* ---------- SVG ---------- */
  .base { fill: var(--base); }
  body.night-mode #vivo { opacity: 0.85; }
  .traco-menor { stroke: #a4a6a8; stroke-width: 2.2; fill: none; }
  .traco-medio { stroke: #f4f4f4; stroke-width: 3; fill: none; }
  .traco-maior { stroke: #f6f6f6; stroke-width: 3.2; fill: none; }
  .traco-carga { stroke: var(--carga); stroke-width: 2.4; fill: none; }
  .traco-carga.viva { stroke: #ffc15a; stroke-width: 3; }
  .rotulos text { font-family: 'RobotoV', Roboto, Arial, sans-serif; font-size: 42px; font-weight: 400; fill: var(--label); text-anchor: middle; }
  .rotulos text.acima { fill: var(--ambar); }
  .limite { fill: var(--vermelho); }
  .arco-azul { fill: var(--azul-ev); }
  .seta-ev { fill: #fff; }
  .icone-fonte path { fill: #fff; opacity: 0.38; }
  .icone-fonte.raio path { fill: none; stroke: #fff; stroke-width: 2.2; stroke-linejoin: round; }
  .icone-fonte.on path { opacity: 1; }
  .rot-d { font-family: 'RobotoV', Roboto, Arial, sans-serif; font-size: 27px; font-weight: 500; fill: #6f757b; letter-spacing: 0.5px; }
  .rot-d.on { fill: var(--label); }
  .rot-off { font-size: 24px; font-weight: 400; fill: #e8eaec; }
  .rot-frac { font-family: 'RobotoV', Roboto, Arial, sans-serif; font-size: 40px; font-weight: 400; fill: #eceeef; text-anchor: middle; }
  .marc-comb path { fill: var(--comb); }
  .marc-comb.baixo path { fill: var(--ambar); }
  .marc-bat path { fill: var(--bat); }
  .sep { stroke: #fff; stroke-opacity: 0.8; stroke-width: 1.6; fill: none; }
  .sep-maior { stroke: #fff; stroke-width: 2.4; fill: none; }
  .ic-marc { color: #eceeef; }
  .ic-marc-seta { fill: #eceeef; }

  /* ---------- Texto ---------- */
  /* Posição e tamanho da velocidade, do câmbio e dos textos de baixo de cada mostrador: bloco
     GERADO:css no fim deste estilo (acompanham a escala dos mostradores). */
  #vel { position: absolute; text-align: center; font-weight: 300; }
  #vel.acima { color: var(--ambar); }
  #velUn { position: absolute; text-align: center; color: var(--ink-dim); }

  #marcha { position: absolute; text-align: center; font-weight: 300; }
  #seletor { position: absolute; background: rgba(236, 240, 244, 0.85); }
  .pos { position: absolute; text-align: center; font-weight: 400; color: #676d73; }
  .pos.on { color: var(--ink); font-weight: 500; }
  #modoEnergia { position: absolute; text-align: center; font-weight: 500; }

  /* Centro: mídia, ou o cartão do modo quando nada toca. Somem na projeção (o vão é o centro). */
  #midia, #semMidia { position: absolute; left: 780px; top: 150px; width: 360px; height: 440px; text-align: center; }
  #midia { display: none; }
  body.com-midia #midia { display: block; }
  body.com-midia #semMidia, body.projetando #midia, body.projetando #semMidia { display: none; }
  #capa {
    position: absolute; left: 80px; top: 22px; width: 200px; height: 200px; overflow: hidden; border-radius: 3px;
    background: linear-gradient(160deg, #2a2d31 0%, #141619 100%);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14);
  }
  #capa svg { position: absolute; left: 64px; top: 64px; width: 72px; height: 72px; color: rgba(236, 240, 244, 0.3); }
  #capaImg { position: absolute; left: 0; top: 0; width: 200px; height: 200px; object-fit: cover; display: none; }
  #capa.com-imagem #capaImg { display: block; }
  #capa.com-imagem svg { display: none; }
  .linha-midia { position: absolute; left: 0; width: 360px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #titulo { top: 244px; font-size: 30px; line-height: 38px; }
  #artista { top: 284px; font-size: 24px; line-height: 32px; color: var(--ink-dim); }
  #album { top: 318px; font-size: 20px; line-height: 26px; color: var(--ink-faint); }
  #tempo { position: absolute; right: 30px; top: 368px; font-size: 22px; line-height: 26px; color: var(--ink-dim); display: none; }
  #progresso { position: absolute; left: 30px; top: 356px; width: 300px; height: 3px; display: none; }
  #progresso i { position: absolute; left: 0; top: 1px; width: 300px; height: 1.5px; background: rgba(210, 220, 230, 0.3); }
  #progresso b {
    position: absolute; left: 0; top: 0; width: 300px; height: 3px; background: var(--ink);
    -webkit-transform-origin: 0 50%; transform-origin: 0 50%; -webkit-transform: scaleX(0); transform: scaleX(0);
  }
  #midia.com-tempo #tempo, #midia.com-tempo #progresso { display: block; }
  #midia.com-tempo #album { display: none; }

  #semMidia .rot { position: absolute; left: 0; top: 172px; width: 360px; font-size: 16px; line-height: 20px; letter-spacing: 5px; color: var(--ink-faint); }
  #semModo { position: absolute; left: 0; top: 200px; width: 360px; font-size: 50px; line-height: 60px; font-weight: 200; letter-spacing: 8px; text-transform: uppercase; }
  #semTraco { position: absolute; left: 150px; top: 274px; width: 60px; height: 2px; background: var(--pico); }
  #semInfo { position: absolute; left: 0; top: 290px; width: 360px; font-size: 24px; line-height: 30px; color: var(--ink-dim); }

  /* Topo (aba) */
  /* Lugar e tamanho no bloco GERADO:css (a aba inteira encolhe junto; ver ESCALA_ABA no gerador). */
  #temp { position: absolute; text-align: center; white-space: nowrap; }
  #relogio { position: absolute; text-align: center; }
  #emblema { position: absolute; }

  /* Embaixo do mostrador esquerdo: hodômetro e trecho. A placa da via é a do carro (Alpha 9.3):
     o painel de fábrica a desenha dentro do mostrador esquerdo, entre o 40 e o 0. */
  #odo { position: absolute; text-align: center; }
  #trecho { position: absolute; text-align: center; white-space: nowrap; }

  /* Rodapé direito: autonomias e consumo */
  .aut-ic { position: absolute; color: var(--ink); }
  .aut-val { position: absolute; text-align: right; }
  .aut-un { position: absolute; }
  #consumo { position: absolute; text-align: right; white-space: nowrap; }


  /* GERADO:css:inicio */
  #temp { left: 704.2px; top: 12.2px; width: 174px; font-size: 36.5px; line-height: 36.5px; }
  #tempUn { font-size: 29.6px; }
  #relogio { left: 1034.8px; top: 12.2px; width: 174px; font-size: 36.5px; line-height: 36.5px; }

  #velUn { left: 384px; top: 466.9px; width: 84px; font-size: 16.1px; line-height: 16.1px; }
  #odo { left: 305.2px; top: 586px; width: 240px; font-size: 24.8px; line-height: 24.8px; }
  #trecho { left: 302px; top: 619.6px; width: 240px; font-size: 24.8px; line-height: 24.8px; }
  #trecho .un { font-size: 19.2px; }
  #marcha { left: 1429.6px; top: 381.5px; width: 70px; font-size: 73.5px; line-height: 73.5px; }

  .pos { left: 1498.9px; width: 22.4px; font-size: 25.2px; line-height: 25.2px; }
  #posP { top: 354.2px; }
  #posR { top: 383.6px; }
  #posN { top: 413px; }
  #posD { top: 442.4px; }
  #modoEnergia { left: 1419.8px; top: 490px; width: 140px; font-size: 18.9px; line-height: 18.9px; letter-spacing: 0.7px; }
  .aut-ic { left: 1253.2px; width: 36.8px; height: 20.8px; }
  #autEvIc { top: 647.6px; }
  #autCombIc { top: 682px; }
  .aut-val { left: 1266px; width: 80px; font-size: 24.8px; line-height: 24.8px; }
  #autEv { top: 646.8px; }
  #autComb { top: 680.4px; }
  .aut-un { left: 1352.4px; font-size: 19.2px; line-height: 24.8px; }
  #autEvUn { top: 646.8px; }
  #autCombUn { top: 680.4px; }
  #consumo { left: 1514px; top: 680.4px; width: 208px; font-size: 24.8px; line-height: 24.8px; }
  #consumo .un { font-size: 19.2px; }
  /* GERADO:css:fim */
</style>
</head>

    semModo: $('semModo'), semInfo: $('semInfo'),
    tempValor: $('tempValor'), tempUn: $('tempUn'), relogio: $('relogio'),
    limite: $('limite'),
    odoValor: $('odoValor'), trechoValor: $('trechoValor'),
    autEv: $('autEv'), autComb: $('autComb'), consumoValor: $('consumoValor'),
    rotReady: $('rotReady'), icRaio: $('icRaio'), icGota: $('icGota'), carga: $('carga'),
    comb: $('comb'), bat: $('bat'),
  };
  const rotulosE = GEO.rotulos.map((v, i) => $('rE' + i));

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function numero(v) { const n = parseFloat(v); return Number.isFinite(n) ? n : null; }
  function ligado(v) {
    return v === true || ['1', 'true', 'on', 'yes', 'ligado']
      .indexOf(String(v == null ? '' : v).trim().toLowerCase()) >= 0;
  }
  function milhar(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function virgula(n, casas) { return n.toFixed(casas).replace('.', ','); }

  // ----- Suavização -----
  // Filtro criticamente amortecido de segunda ordem sobre o ÂNGULO do ponteiro (o mesmo do
  // Stuttgart MBUX e do Bávaro ID8): `ms` é o tempo para andar 95% de um degrau. Solução exata do
  // passo, então um quadro longo não desestabiliza; acima de 400 ms crava.
  function canal(ms, eps) { return { alvo: null, atual: null, taxa: 0, omega: 4.744 / Math.max(0.001, ms / 1000), eps: eps }; }
  function mirar(c, v) {
    if (c.atual === null) { c.atual = v; c.alvo = v; c.taxa = 0; return; }
    c.alvo = v;
  }
  function passo(c, dt) {
    if (c.atual === null || (c.atual === c.alvo && c.taxa === 0)) return false;
    if (dt > 0.4) { c.atual = c.alvo; c.taxa = 0; return false; }
    const e0 = c.atual - c.alvo;
    const b = c.taxa + c.omega * e0;
    const k = Math.exp(-c.omega * dt);
    c.atual = c.alvo + (e0 + b * dt) * k;
    c.taxa = (c.taxa - c.omega * b * dt) * k;
    if (Math.abs(c.alvo - c.atual) <= c.eps && Math.abs(c.taxa) <= c.omega * c.eps) {
      c.atual = c.alvo; c.taxa = 0; return false;
    }
    return true;
  }
  const C = {
    angE: canal(300, 0.02),
    angD: canal(320, 0.02),
  };

  // ----- Escalas (tabelas do gerador) -----
  function anguloDe(tab, v) {
    if (v <= tab[0][0]) return tab[0][1];
    for (let i = 1; i < tab.length; i++) {
      if (v <= tab[i][0]) {
        const a = tab[i - 1], b = tab[i];
        return a[1] + (b[1] - a[1]) * (v - a[0]) / (b[0] - a[0]);
      }
    }
    return tab[tab.length - 1][1];
  }

  // ----- Desenho (só escreve no DOM quando o valor desenhado muda) -----
  const escrito = {};
  function mudou(chave, valor) { if (escrito[chave] === valor) return false; escrito[chave] = valor; return true; }

  function montarMostrador(lado) {
    const g = GEO[lado === 'E' ? 'e' : 'd'];
    return {
      g: g,
      fatias: Array.prototype.slice.call($('fatias' + lado).children),
      acesas: 0,
      perto: $('luzPerto' + lado),
      longe: $('luzLonge' + lado),
      anguloLonge: null,
      luzFrente: document.querySelectorAll('#luzPerto' + lado + ' .luz-frente, #luzLonge' + lado + ' .luz-frente'),
    };
  }
  const MOSTRADOR = { E: montarMostrador('E'), D: montarMostrador('D') };

  // O ponteiro gira junto com a luz de perto (um transform por quadro); a luz de longe só
  // acompanha quando ele se afasta GEO.longePasso graus dela, e crava no lugar quando o ponteiro
  // para (ver o gerador: o que gira é repintado inteiro a cada quadro). O enchimento de base
  // acende em fatias de GEO.fatia graus: a borda da última fica sempre embaixo do começo opaco da
  // luz da frente, então o degrau nunca aparece; só as fatias que mudaram de lado são tocadas.
  function desenharMostrador(lado, angulo, parado) {
    const m = MOSTRADOR[lado];
    const s = clamp(m.g.ini - angulo, 0, m.g.ini - m.g.fim);
    const k = clamp(Math.ceil(s / GEO.fatia - 1e-6), 0, m.fatias.length);
    if (k !== m.acesas) {
      const a = Math.min(k, m.acesas), b = Math.max(k, m.acesas);
      for (let i = a; i < b; i++) m.fatias[i].style.visibility = i < k ? 'visible' : 'hidden';
      m.acesas = k;
    }
    // Em repouso no começo da escala (parado, ou desligado no OFF) a luz da frente baixa pela
    // metade: sozinha, sem enchimento atrás, ela pareceria uma leitura.
    const repouso = s < 0.5;
    if (mudou('repouso' + lado, repouso)) {
      for (let i = 0; i < m.luzFrente.length; i++) m.luzFrente[i].style.opacity = repouso ? '0.5' : '';
    }
    const tf = 'rotate(' + (90 - angulo).toFixed(2) + ' ' + m.g.cx + ' ' + GEO.cy + ')';
    if (mudou('giro' + lado, tf)) m.perto.setAttribute('transform', tf);
    if (m.anguloLonge === null || Math.abs(angulo - m.anguloLonge) >= GEO.longePasso || (parado && angulo !== m.anguloLonge)) {
      m.anguloLonge = angulo;
      m.longe.setAttribute('transform', tf);
    }
  }

  // ----- Estado bruto (texto) -----
  const est = {
    velocidade: null, potencia: 0,
    pronto: null, prontoPeloReady: false, motorGirando: false,
    tempExt: null, fahrenheit: false,
    limite: null, limiteOk: false,
    modo: '0', modoEnergia: '0', consumo: null,
    midia: { titulo: '', artista: '', album: '', capa: '', posicao: null, duracao: null },
  };

  // Motor a combustão girando, com histerese (o engine_state é ignição, não motor).
  const ICE_LIGA = 400, ICE_DESLIGA = 150;
  // O ponteiro da direita descansa no OFF com o carro desligado; READY é o zero da potência.
  function mirarPotencia() {
    mirar(C.angD, est.pronto === false ? GEO.d.ini : anguloDe(GEO.d.escala, est.potencia));
    scheduleRender();
  }
  function atualizarPronto() {
    const pronto = est.pronto !== false;
    if (els.rotReady) els.rotReady.classList.toggle('on', pronto);
    // Raio: andando no elétrico. Gota: motor a combustão girando.
    if (els.icRaio) els.icRaio.classList.toggle('on', pronto && !est.motorGirando);
    if (els.icGota) els.icGota.classList.toggle('on', est.motorGirando);
  }

  function desenharTemp() {
    if (est.tempExt === null) return;
    const v = Math.round(est.fahrenheit ? est.tempExt * 9 / 5 + 32 : est.tempExt);
    els.tempValor.textContent = (v < 0 ? '−' : '') + Math.abs(v);
    els.tempUn.textContent = est.fahrenheit ? '°F' : '°C';
  }

  // Limite da via (TSR): a marca vermelha na escala; a velocidade fica âmbar acima dela. A placa
  // é a do carro, desenhada pelo painel de fábrica dentro do mostrador.
  function atualizarLimite() {
    const ok = est.limiteOk && est.limite !== null && est.limite > 0;
    if (els.limite) els.limite.setAttribute('visibility', ok ? 'visible' : 'hidden');
    if (ok) {
      const a = anguloDe(GEO.e.escala, clamp(est.limite, 0, 260));
      if (els.limite) els.limite.setAttribute('transform', 'rotate(' + (90 - a).toFixed(2) + ' ' + GEO.e.cx + ' ' + GEO.cy + ')');
    }
    atualizarAcima();
  }
  function atualizarAcima() {
    const ok = est.limiteOk && est.limite !== null && est.limite > 0;
    const acima = ok && est.velocidade !== null && est.velocidade > est.limite + 3;
    if (mudou('acima', acima)) els.vel.classList.toggle('acima', acima);
  }

  // Marcadores em arco (combustível e bateria): segmentos de 1° que acendem do E para o F.
  function desenharMarcador(el, n, pct, chave) {
    if (!el) return;
    const k = Math.round(clamp(pct, 0, 100) / 100 * n);
    const antes = escrito[chave] === undefined ? 0 : escrito[chave];
    if (!mudou(chave, k)) return;
    const itens = el.children;
    for (let i = Math.min(k, antes); i < Math.max(k, antes); i++) {
      itens[i].setAttribute('visibility', i < k ? 'visible' : 'hidden');
    }
  }

  // ----- Trecho -----
  // Distância desde que o painel abriu: a parte inteira vem do hodômetro (a diferença desde a
  // primeira leitura) e a fração é a velocidade integrada desde a última virada dele. Sem
  // hodômetro, só a velocidade integrada.
  const trecho = { odo0: null, odo: null, frac: 0, soma: 0, t: null, v: 0 };
  function acumularTrecho() {
    const agora = Date.now();
    if (trecho.t !== null) {
      const dt = Math.min(5, Math.max(0, (agora - trecho.t) / 1000));
      const km = trecho.v * dt / 3600;
      trecho.frac += km;
      trecho.soma += km;
    }
    trecho.t = agora;
  }
  function desenharTrecho() {
    const km = trecho.odo0 !== null && trecho.odo !== null
      ? Math.max(0, trecho.odo - trecho.odo0) + Math.min(trecho.frac, 0.95)
      : trecho.soma;
    const txt = virgula(Math.floor(km * 10) / 10, 1);
    if (mudou('trecho', txt)) els.trechoValor.textContent = txt;
  }

  // ----- Mídia -----
  function mmss(seg) {
    const s = Math.max(0, Math.round(seg));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  function atualizarMidia() {
    const m = est.midia;
    const tem = m.titulo.trim().length > 0;
    document.body.classList.toggle('com-midia', tem);
    if (!tem) return;
    els.titulo.textContent = m.titulo;
    els.artista.textContent = m.artista;
    els.album.textContent = m.album && m.album !== m.titulo ? m.album : '';
    if (m.capa) {
      if (els.capaImg.getAttribute('src') !== m.capa) els.capaImg.setAttribute('src', m.capa);
      els.capa.classList.add('com-imagem');
    } else {
      els.capaImg.removeAttribute('src');
      els.capa.classList.remove('com-imagem');
    }
    atualizarTempo();
  }
  // Posição e duração ainda não chegam do app (as chaves existem no contrato); a barra só aparece
  // quando as duas vierem. Milissegundos ou segundos: acima de 10 h só pode ser milissegundo.
  function atualizarTempo() {
    const m = est.midia;
    let dur = m.duracao, pos = m.posicao;
    const tem = dur !== null && dur > 0 && pos !== null && pos >= 0;
    els.midia.classList.toggle('com-tempo', tem);
    if (!tem) return;
    if (dur > 36000) { dur /= 1000; pos /= 1000; }
    pos = Math.min(pos, dur);
    els.tempo.textContent = '- ' + mmss(dur - pos);
    els.progressoCheio.style.transform = 'scaleX(' + (pos / dur).toFixed(4) + ')';
  }

  // ----- Modos -----
  const DRIVE_MODE_LABELS = { '0': 'Normal', '1': 'Sport', '2': 'Eco', '3': 'Neve', '4': 'Areia', '5': 'Lama', '11': 'AWD' };
  const EV_MODE_LABELS = { '0': 'HEV', '1': 'EV Prior.', '3': 'EV' };
  // O "HYBRID" da foto: o modo de energia do carro.
  const MODO_ENERGIA = { '0': 'HÍBRIDO', '1': 'EV PRIOR.', '3': 'ELÉTRICO' };
  function atualizarModos() {
    els.modoEnergia.textContent = MODO_ENERGIA[est.modoEnergia] || 'HÍBRIDO';
    els.semModo.textContent = DRIVE_MODE_LABELS[est.modo] || 'Normal';
    const partes = [EV_MODE_LABELS[est.modoEnergia] || 'HEV'];
    if (est.consumo !== null) partes.push(virgula(Math.min(est.consumo, 99.9), 1) + ' km/l');
    els.semInfo.textContent = partes.join('  ·  ');
  }

  // Consumo instantâneo: "{métrica,consumo}" ou número solto. Métrica 1 = L/100 km (vira km/l);
  // métrica 4 = parado, em L/h, sem distância: não existe km/l.
  function consumoKml(raw) {
    const s = raw == null ? '' : String(raw);
    let metrica = 1;
    let consumo = 0;
    if (s.charAt(0) === '{' && s.charAt(s.length - 1) === '}' && s.indexOf(',') > 0) {
      const p = s.slice(1, -1).split(',');
      metrica = parseFloat(p[0]) || 0;
      consumo = parseFloat(p[1]) || 0;
    } else {
      consumo = parseFloat(s) || 0;
    }
    if (metrica === 4 || consumo <= 0) return null;
    return Math.trunc((100 / consumo) * 10) / 10;
  }

  // ----- Câmbio -----
  const GEAR_LABELS = { '0': 'N', '1': 'N', '2': 'D', '3': 'P', '4': 'R' };
  function desenharMarcha(letra) {
    if (!mudou('marcha', letra)) return;
    els.marcha.textContent = letra;
    for (const k in els.pos) els.pos[k].classList.toggle('on', k === letra);
  }

  // ----- Tom do painel (ajuste do tema) -----
  const TONS = {
    ardosia: { base: GEO.tom.base, pico: GEO.tom.picoTras, face: GEO.tom.picoFrente },
    // A luz da face (à frente do ponteiro) fica quase neutra em todos os tons: colorida demais,
    // ela se confunde com o enchimento.
    azul: { base: '#141d28', pico: '#6d9ccc', face: '#434d59' },
    cobre: { base: '#241c18', pico: '#b8927a', face: '#544b45' },
    vermelho: { base: '#261716', pico: '#c9705e', face: '#564644' },
  };
  // "Seguir modo": Eco no azul, Sport no vermelho, o resto na ardósia da foto.
  const TOM_DO_MODO = { '2': 'azul', '1': 'vermelho' };
  // A página já nasce pintada na ardósia (cores do gerador); trocar de tom refaz a cor de cada
  // cunha da luz pela fração guardada nela (data-a) e troca a base das fatias pela variável.
  function hexRgb(h) { return [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); }
  function misturar(a, b, t) {
    const x = hexRgb(a), y = hexRgb(b);
    return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join('');
  }
  const CUNHAS_TRAS = Array.prototype.slice.call(document.querySelectorAll('#vivo .gt'));
  const CUNHAS_FRENTE = Array.prototype.slice.call(document.querySelectorAll('#vivo .gf'));
  let preferenciaDeTom = 'ardosia';
  let tomAtual = 'ardosia';
  function aplicarTom() {
    const nome = preferenciaDeTom === 'modo' ? (TOM_DO_MODO[est.modo] || 'ardosia') : preferenciaDeTom;
    if (nome === tomAtual) return;
    tomAtual = nome;
    const t = TONS[nome] || TONS.ardosia;
    const r = document.documentElement.style;
    r.setProperty('--base', t.base);
    r.setProperty('--pico', t.pico);
    r.setProperty('--face', t.face);
    CUNHAS_TRAS.forEach((el) => el.setAttribute('fill', misturar(t.base, t.pico, parseFloat(el.getAttribute('data-a')))));
    CUNHAS_FRENTE.forEach((el) => el.setAttribute('fill', misturar('#000000', t.face, parseFloat(el.getAttribute('data-a')))));
  }
  function lerPreferencias() {
    try {
      if (!window.Android || typeof window.Android.getPreference !== 'function') return;
      const modo = String(window.Android.getPreference('displayMode', 'Dia') || '');
      document.body.classList.toggle('night-mode', modo === 'Noite');
      const tom = String(window.Android.getPreference('panelTone', 'Ardósia') || '').toLowerCase();
      const pref = tom.indexOf('azul') >= 0 ? 'azul'
        : tom.indexOf('cobre') >= 0 ? 'cobre'
        : tom.indexOf('verm') >= 0 ? 'vermelho'
        : (tom.indexOf('seguir') >= 0 || tom.indexOf('modo') >= 0) ? 'modo'
        : 'ardosia';
      if (pref !== preferenciaDeTom) { preferenciaDeTom = pref; aplicarTom(); }
    } catch (e) { /* ignore */ }
  }

  function tickClock() {
    const d = new Date();
    els.relogio.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tickClock();
  setInterval(tickClock, 5000);
  setInterval(() => { acumularTrecho(); desenharTrecho(); }, 1000);

  // ----- Coalescência de render -----
  // Cada chave chega num evaluateJavascript separado; desenhar uma vez por quadro. Os canais
  // suavizados pedem o próximo quadro só enquanto ainda estão andando.
  let renderScheduled = false;
  let renderFallbackTimer = 0;
  let ultimoQuadro = 0;
  function flushRender(ts) {
    if (!renderScheduled) return;
    renderScheduled = false;
    clearTimeout(renderFallbackTimer);
    const agora = typeof ts === 'number' && ts > 0 ? ts : performance.now();
    const dt = ultimoQuadro ? (agora - ultimoQuadro) / 1000 : 0;
    ultimoQuadro = agora;
    const andaE = passo(C.angE, dt);
    const andaD = passo(C.angD, dt);
    const andando = andaE || andaD;

    if (est.velocidade !== null) {
      const v = String(Math.round(est.velocidade));
      if (mudou('vel', v)) els.velValor.textContent = v;
    }
    if (C.angE.atual !== null) desenharMostrador('E', C.angE.atual, !andaE);
    if (C.angD.atual !== null) desenharMostrador('D', C.angD.atual, !andaD);

    if (andando) scheduleRender();
    else ultimoQuadro = 0;
  }
  function scheduleRender() {
    if (renderScheduled) return;
    renderScheduled = true;
    requestAnimationFrame(flushRender);
    // Rede de segurança: com o WebView oculto o rAF não dispara; os valores não podem congelar.
    renderFallbackTimer = setTimeout(flushRender, 120);
  }

  function handleTelemetry(key, raw) {
    switch (key) {
      case 'car.basic.vehicle_speed': {
        const v = numero(raw);
        acumularTrecho();
        est.velocidade = v === null ? 0 : Math.max(0, v);
        trecho.v = est.velocidade;
        mirar(C.angE, anguloDe(GEO.e.escala, clamp(est.velocidade, 0, 260)));
        atualizarAcima();
        scheduleRender();
        break;
      }
      case 'car.basic.engine_speed': {
        const rpm = Math.max(0, numero(raw) || 0);
        if (!est.motorGirando && rpm >= ICE_LIGA) est.motorGirando = true;
        else if (est.motorGirando && rpm <= ICE_DESLIGA) est.motorGirando = false;
        atualizarPronto();
        break;
      }
      case 'car.ev_info.energy_output_percentage': {
        const p = clamp(numero(raw) || 0, -100, 100);
        est.potencia = p;
        if (mudou('regen', p < -2)) els.carga.classList.toggle('viva', p < -2);
        mirarPotencia();
        break;
      }
      // READY vem de driving_ready_state ("1" pronto). O engine_state é ignição e, lido no carro
      // em 30/09, vinha 11 parado em READY: por ele (=== 13) o READY apagava com o carro pronto.
      case 'car.basic.driving_ready_state': {
        const s = String(raw).trim();
        est.prontoPeloReady = s !== '';
        est.pronto = s === '1' ? true : (s === '0' || s === '-1') ? false : null;
        atualizarPronto();
        mirarPotencia();
        break;
      }
      // Reserva para um app sem driving_ready_state no contrato (anterior à Alpha 9.4).
      case 'car.basic.engine_state': {
        if (est.prontoPeloReady) break;
        const n = parseInt(raw, 10);
        est.pronto = Number.isFinite(n) ? (n === 11 || n === 13) : null;
        atualizarPronto();
        mirarPotencia();
        break;
      }
      case 'car.ev_info.cur_battery_power_percentage': {
        const pct = numero(raw);
        desenharMarcador(els.bat, GEO.bat.n, pct === null ? 0 : pct, 'bat');
        break;
      }
      case 'car.basic.remain_fuel_percentage': {
        const pct = clamp(numero(raw) || 0, 0, 100);
        desenharMarcador(els.comb, GEO.comb.n, pct, 'comb');
        els.comb.classList.toggle('baixo', pct < 12);
        break;
      }
      case 'car.ev_info.fuel_mode_remain_odometer': {
        const km = numero(raw);
        els.autComb.textContent = km === null ? '---' : Math.round(km);
        break;
      }
      case 'car.ev_info.electric_mode_remain_odometer': {
        const km = numero(raw);
        els.autEv.textContent = km === null ? '--' : Math.round(km);
        break;
      }
      case 'car.basic.total_odometer': {
        const odo = numero(raw);
        if (odo === null) break;
        els.odoValor.textContent = milhar(Math.round(odo));
        if (trecho.odo0 === null) trecho.odo0 = odo;
        if (trecho.odo !== odo) { trecho.odo = odo; trecho.frac = 0; }
        desenharTrecho();
        break;
      }
      case 'car.basic.gear_status': {
        // O carro manda o código (2 = D); o simulador do app manda a letra.
        const s = String(raw == null ? '' : raw).trim().toUpperCase();
        desenharMarcha(/^[PRND]$/.test(s) ? s : (GEAR_LABELS[String(parseInt(s, 10))] || 'N'));
        break;
      }
      case 'car.drive_setting.drive_mode': {
        const m = String(parseInt(raw, 10));
        est.modo = DRIVE_MODE_LABELS[m] ? m : '0';
        atualizarModos();
        aplicarTom();
        break;
      }
      case 'car.ev_setting.power_model_config':
        est.modoEnergia = String(raw).trim();
        atualizarModos();
        break;
      case 'car.basic.outside_temp': {
        const t = numero(raw);
        if (t !== null) { est.tempExt = t; desenharTemp(); }
        break;
      }
      case 'car.configure.default_temp_unit':
        est.fahrenheit = String(raw).trim() === '1';
        desenharTemp();
        break;
      case 'car.basic.instant_fuel_consumption': {
        est.consumo = consumoKml(raw);
        els.consumoValor.textContent = est.consumo === null ? '--,-' : virgula(Math.min(est.consumo, 99.9), 1);
        atualizarModos();
        break;
      }
      case 'car.basic.head_light_status': {
        // O app entrega o estado já resolvido (HeadlightPolicy); aqui é só ligado/desligado.
        const aceso = ligado(raw);
        document.body.classList.toggle('mode-headlight', aceso);
        break;
      }
      case 'car.map.tsr.nav_speed_limit':
        est.limite = numero(raw);
        atualizarLimite();
        break;
      case 'car.map.tsr.nav_speed_limit_sign_status':
        est.limiteOk = ligado(raw);
        atualizarLimite();
        break;
      case 'app.media.title':
        est.midia.titulo = raw ? String(raw) : '';
        atualizarMidia();
        break;
      case 'app.media.artist':
        est.midia.artista = raw ? String(raw) : '';
        atualizarMidia();
        break;
      case 'app.media.album':
        est.midia.album = raw ? String(raw).trim() : '';
        atualizarMidia();
        break;
      case 'app.media.album_art':
        est.midia.capa = raw ? String(raw).trim() : '';
        atualizarMidia();
        break;
      case 'app.media.position':
        est.midia.posicao = numero(raw);
        atualizarTempo();
        break;
      case 'app.media.duration':
        est.midia.duracao = numero(raw);
        atualizarTempo();
        break;
      default:
        break;
    }
  }

  // ----- Ceder a tela -----
  // Só projeção de verdade (CarPlay/Android Auto/espelhamento) tira o tema da frente. Aviso do
  // carro não: ele é desenhado pelo próprio tema (ver desenharAvisos).
  const projectionState = { carPlayInDash: false, projectionMirrorInDash: false, projectionPreparingD3: false };
  function applyYieldToCar() {
    const yielding = projectionState.carPlayInDash ||
      projectionState.projectionMirrorInDash || projectionState.projectionPreparingD3;
    els.app.classList.toggle('hidden', yielding);
    document.body.classList.toggle('yield-to-car', yielding);
  }

  // ----- Vão da projeção da central -----
  // O centro, entre os aros dos dois mostradores. Declarar faz o app pôr o vídeo POR BAIXO desta
  // página; o fundo abre o buraco (aplicarVaoDaProjecao) e os mostradores continuam por cima.
  // Alpha 9.5: o vão vai de dentro de um mostrador a dentro do outro, como no NTG 5.5 (coffe3). As
  // bordas caem embaixo das faces (opacas), e a imagem se dissolve por baixo delas; o pé para
  // antes das autonomias do mostrador direito.
  const PROJ_BOX = { x: 560, y: 84, w: 800, h: 560 };
  const PROJ_PENA_X = 96;
  const PROJ_PENA_Y = 48;

  function sabeRecortarOFundo() {
    try {
      if (!window.CSS || typeof window.CSS.supports !== 'function') return false;
      const g = 'linear-gradient(to right, #000 0px, transparent 10px)';
      return window.CSS.supports('-webkit-mask-image', g) || window.CSS.supports('mask-image', g);
    } catch (e) { return false; }
  }
  let recortaOFundo = null;
  function declararVaoDaProjecao() {
    if (recortaOFundo === null) {
      recortaOFundo = sabeRecortarOFundo();
      if (!recortaOFundo) console.warn('[SENSUS] sem suporte a mascara: a projecao vai por cima do tema');
    }
    if (!recortaOFundo) return;
    try {
      if (window.Android && typeof window.Android.setProjectionBox === 'function') {
        window.Android.setProjectionBox(PROJ_BOX.x, PROJ_BOX.y, PROJ_BOX.w, PROJ_BOX.h);
      }
    } catch (e) { /* ponte antiga: sem declaração, o app volta a varrer o DOM */ }
  }
  function aplicarVaoDaProjecao(valor) {
    const bg = els.bg;
    const n = String(valor == null ? '' : valor).split(',');
    const x = parseInt(n[0], 10), y = parseInt(n[1], 10);
    const l = parseInt(n[2], 10), a = parseInt(n[3], 10);
    if (n.length < 4 || !(l > 0) || !(a > 0)) {
      bg.style.webkitMaskImage = '';
      bg.style.maskImage = '';
      document.body.classList.remove('projetando');
      return;
    }
    const L = x, R = x + l, T = y, B = y + a;
    const px = Math.min(PROJ_PENA_X, Math.floor(l / 3));
    const py = Math.min(PROJ_PENA_Y, Math.floor(a / 3));
    const pe = L <= 0 ? 0 : px, pd = R >= 1920 ? 0 : px;
    const pt = T <= 0 ? 0 : py, pb = B >= 720 ? 0 : py;
    const gx = 'linear-gradient(to right, #000 ' + L + 'px, transparent ' + (L + pe) + 'px, transparent ' + (R - pd) + 'px, #000 ' + R + 'px)';
    const gy = 'linear-gradient(to bottom, #000 ' + T + 'px, transparent ' + (T + pt) + 'px, transparent ' + (B - pb) + 'px, #000 ' + B + 'px)';
    const veu = $('projscrim');
    if (veu) {
      veu.style.left = L + 'px';
      veu.style.top = T + 'px';
      veu.style.width = l + 'px';
      veu.style.height = a + 'px';
      const mv = 'linear-gradient(to right, transparent 0px, #000 ' + pe + 'px, #000 ' + (l - pd) + 'px, transparent ' + l + 'px)';
      veu.style.webkitMaskImage = mv;
      veu.style.maskImage = mv;
    }
    bg.style.webkitMaskImage = gx + ', ' + gy;
    bg.style.maskImage = gx + ', ' + gy;
    document.body.classList.add('projetando');
  }

  const SUBSCRIBE_KEYS = [
    'car.basic.vehicle_speed',
    'car.basic.engine_speed',
    'car.ev_info.energy_output_percentage',
    'car.ev_info.cur_battery_power_percentage',
    'car.basic.remain_fuel_percentage',
    'car.ev_info.fuel_mode_remain_odometer',
    'car.ev_info.electric_mode_remain_odometer',
    'car.basic.total_odometer',
    'car.basic.gear_status',
    'car.drive_setting.drive_mode',
    'car.ev_setting.power_model_config',
    'car.basic.outside_temp',
    'car.configure.default_temp_unit',
    'car.basic.instant_fuel_consumption',
    'car.basic.head_light_status',
    'car.basic.driving_ready_state',
    'car.basic.engine_state',
    'car.map.tsr.nav_speed_limit',
    'car.map.tsr.nav_speed_limit_sign_status',
    'app.media.title',
    'app.media.artist',
    'app.media.album',
    'app.media.album_art',
    'app.media.position',
    'app.media.duration',
    'warningActive'
  ];

  // ===================== Simulação local (sem window.Android) =====================
  // ?photo=1 congela o quadro da foto; ?mode=Noite, ?tom=Azul|Cobre|Vermelho|Seguir modo, ?dm=1,
  // ?farol=1 (modo farol), ?proj=1, ?regen=1, ?sem=1 (sem mídia),
  // ?off=1 (carro desligado), ?limite=80, ?vel=, ?pot=, ?comb=, ?bat= e ?tempo=1 exercitam o resto.
  const CAPA_DEMO = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">' +
    '<defs><linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfd8e2"/>' +
    '<stop offset="0.5" stop-color="#6f8397"/><stop offset="1" stop-color="#1d2733"/></linearGradient></defs>' +
    '<rect width="200" height="200" fill="url(#c)"/>' +
    '<path d="M0 132 L64 88 L112 120 L150 96 L200 128 V200 H0 Z" fill="#101820" fill-opacity="0.85"/>' +
    '<circle cx="146" cy="52" r="18" fill="#fff" fill-opacity="0.55"/></svg>');
  function installMockBridge() {
    console.warn('[SENSUS] window.Android ausente — usando simulação local para preview.');
    const q = new URLSearchParams(location.search);
    const foto = q.get('photo') === '1';
    window.Android = {
      getAvailableKeys: () => JSON.stringify(SUBSCRIBE_KEYS),
      subscribe: () => {}, unsubscribe: () => {},
      getCarData: () => '0', updateCarData: () => {},
      getPreference: (k, d) => {
        if (k === 'displayMode') return q.get('mode') || d;
        if (k === 'panelTone') return q.get('tom') || d;
        return d;
      },
      savePreference: () => {}, heartbeat: () => {}, triggerSystemAction: () => {},
      setAppDefaultDimensions: () => {}, setProjectionBox: () => {},
    };
    const regen = q.get('regen') === '1';
    const semMidia = q.get('sem') === '1' || foto;
    const seed = {
      'car.basic.vehicle_speed': q.get('vel') || '75',
      'car.basic.engine_speed': '0',
      'car.ev_info.energy_output_percentage': regen ? '-60' : (q.get('pot') || '22'),
      'car.ev_info.cur_battery_power_percentage': q.get('bat') || '74',
      'car.basic.remain_fuel_percentage': q.get('comb') || '62',
      'car.ev_info.fuel_mode_remain_odometer': '980',
      'car.ev_info.electric_mode_remain_odometer': '30',
      'car.basic.total_odometer': '2828',
      'car.basic.gear_status': '2',
      'car.drive_setting.drive_mode': q.get('dm') || '0',
      'car.ev_setting.power_model_config': '0',
      'car.basic.outside_temp': '-4',
      'car.basic.instant_fuel_consumption': '{1,4.5}',
      'car.basic.head_light_status': q.get('farol') === '1' ? '1' : '0',
      'car.basic.driving_ready_state': q.get('off') === '1' ? '0' : '1',
      'car.basic.engine_state': q.get('off') === '1' ? '1' : '11',
      'car.map.tsr.nav_speed_limit': q.get('limite') || '0',
      'car.map.tsr.nav_speed_limit_sign_status': q.get('limite') ? '1' : '0',
      'app.media.state': 'playing',
      'app.media.title': semMidia ? '' : 'Dancing in the Moonlight',
      'app.media.artist': semMidia ? '' : 'Toploader',
      'app.media.album': semMidia ? '' : 'Onka\'s Big Moka',
      'app.media.album_art': semMidia ? '' : CAPA_DEMO,
    };
    if (q.get('tempo') === '1') { seed['app.media.duration'] = '232000'; seed['app.media.position'] = '71000'; }
    Object.keys(seed).forEach((k) => handleTelemetry(k, seed[k]));
    // O trecho da foto ("1222.4 km") só no quadro congelado.
    if (foto) { trecho.odo0 = trecho.odo - 1222; trecho.frac = 0.4; desenharTrecho(); }
    if (q.get('proj') === '1') window.control('projectionWindow', PROJ_BOX.x + ',' + PROJ_BOX.y + ',' + PROJ_BOX.w + ',' + PROJ_BOX.h);
    if (foto || q.get('vel') || q.get('pot') || regen || q.get('off') === '1') return;

    let t = 0;
    let vel = 0;
    setInterval(() => {
      t += 0.1;
      const alvo = 110 + 105 * Math.sin(t / 6);
      vel += clamp(alvo - vel, -2.4, 1.8);
      handleTelemetry('car.basic.vehicle_speed', vel.toFixed(1));
      handleTelemetry('car.basic.engine_speed', vel < 60 ? '0' : String(Math.round(1200 + vel * 18)));
      handleTelemetry('car.ev_info.energy_output_percentage', String(Math.round(70 * Math.sin(t / 2.2))));
    }, 100);
  }

  function initBridge() {
    installHandlers();
    if (!window.Android || typeof window.Android.subscribe !== 'function') installMockBridge();

    try {
      if (window.Android && typeof window.Android.subscribe === 'function') {
        window.Android.subscribe(JSON.stringify(SUBSCRIBE_KEYS));
      }
      if (window.Android && typeof window.Android.setAppDefaultDimensions === 'function') {
        window.Android.setAppDefaultDimensions(772, 92, 376, 600); // área de app de antes: o vão largo da 9.5 é só da projeção
      }
      declararVaoDaProjecao();
      lerPreferencias();
    } catch (e) {
      console.error('[SENSUS] bridge init failed:', e);
    }

    setInterval(() => {
      try {
        if (window.Android && typeof window.Android.heartbeat === 'function') window.Android.heartbeat();
      } catch (e) { /* ignore */ }
      lerPreferencias();
      // Redeclara o vão a cada batida: idempotente no app, e a rede se a carga se perder.
      try { declararVaoDaProjecao(); } catch (e) { /* ignore */ }
    }, 2000);
  }

  function installHandlers() {
    const prevOnDataChanged = window.onDataChanged;
    window.onDataChanged = function (key, value) {
      if (typeof prevOnDataChanged === 'function') {
        try { prevOnDataChanged(key, value); } catch (e) { console.error(e); }
      }
      handleTelemetry(key, value);
    };
    // O tema não se esconde no card 0 e não trata volante (é um mostrador passivo).
    window.onCardChanged = function () {};

    const prevControl = window.control;
    window.control = function (key, value) {
      if (typeof prevControl === 'function') {
        try { prevControl(key, value); } catch (e) { /* ignore */ }
      }
      if (Object.prototype.hasOwnProperty.call(projectionState, key)) {
        projectionState[key] = (value === true || value === 'true');
        applyYieldToCar();
        return;
      }
      if (key === 'projectionWindow') { aplicarVaoDaProjecao(value); return; }
    };
  }

  aplicarTom();
  atualizarModos();
  atualizarPronto();
  desenharMarcha('P');
  mirar(C.angE, GEO.e.ini);
  mirar(C.angD, GEO.d.ini);
  desenharMostrador('E', GEO.e.ini, true);
  desenharMostrador('D', GEO.d.ini, true);
  initBridge();
})();
</script>
</body>
