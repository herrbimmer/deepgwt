<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bávaro Aberto</title>
<style>
  /* Alpha 6.9: redesenhado a partir do painel de referência (aro branco fino, faixa vermelha fina,
     ponteiro laranja curto com brilho, escala desigual até 260, marcha dentro do mostrador direito,
     rodapé com autonomia/hora/ODO/temperaturas/bateria). A geometria dos mostradores sai de
     scripts/gerar-bavarian-id7.mjs; o que está entre os marcadores GERADO não se edita à mão.
     O mostrador direito continua sendo POTÊNCIA/REGENERAÇÃO (não conta-giros). */
  :root {
    --ink: #f2f4f6;
    --ink-dim: rgba(242, 244, 246, 0.6);
    --ink-faint: rgba(242, 244, 246, 0.32);
    --label: rgba(222, 226, 232, 0.92);
    --band: #d4182a;
    --needle: #ff7b1e;
    --needle-glow: #ff4a12;
    --regen: #18d779;
    --regen-light: #7affba;
    --marker: #ff5132;
    --reserve: #e3202b;
  }

  /* MODO NOTURNO (farol aceso)
     Mesma mecânica dos outros temas: o app liga a classe no <body> quando resolve que o farol está
     aceso, e lê a cor de --night-tint/--night-glow, que ele injeta a partir do ajuste "Cor do modo
     noturno" (Telas > Painel Virtual). Texto, faixa e ponteiro passam para essa cor; a placa de
     limite continua branca e vermelha, como a placa de verdade. */
  body.mode-headlight {
    --ink: var(--night-tint, #ff9500);
    --label: var(--night-tint, #ff9500);
    --band: var(--night-tint, #ff9500);
    --needle: var(--night-tint, #ff9500);
    --needle-glow: var(--night-tint, #ff9500);
    --ink-dim: rgba(242, 244, 246, 0.55);
    --ink-faint: rgba(242, 244, 246, 0.28);
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 720px;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
  }
  /* Alpha 9.5: o fundo saiu do body para o #bg, para a projeção da central poder abrir um vão só
     nele (aplicarVaoDaProjecao) e os mostradores continuarem por cima, como no NTG 5.5. */
  #bg { position: absolute; left: 0; top: 0; width: 1920px; height: 720px; background: #050405; z-index: 0; }
  body.yield-to-car #bg { opacity: 0; }
  #projscrim {
    position: absolute; display: none; z-index: 0; pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 62%, rgba(0,0,0,.7) 100%);
  }
  body.projetando #projscrim { display: block; }
  /* Faces fumê enquanto projeta: os mostradores deste tema são só contorno, e a imagem passaria
     por trás dos números. Uma elipse escura em cada um (já na escala 0,93 do #app) fecha a face e
     deixa a imagem se dissolver por baixo do aro. */
  #projfumo {
    position: absolute; left: 0; top: 0; width: 1920px; height: 720px; display: none; z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 330px 300px at 468px 340px, rgba(5,4,5,.92) 0, rgba(5,4,5,.92) 82%, rgba(5,4,5,0) 100%),
      radial-gradient(ellipse 330px 300px at 1452px 340px, rgba(5,4,5,.92) 0, rgba(5,4,5,.92) 82%, rgba(5,4,5,0) 100%);
  }
  body.projetando #projfumo { display: block; }

  /* 1.5.0 (Alpha 7.6): o painel inteiro 7% menor, em volta do centro da tela. Os mostradores ficam
     7% menores e 7% mais próximos um do outro (eixos 1008 -> 937 px; vão entre os aros 398 -> 370 px)
     e os mini-mostradores saem da borda da tela. É UMA escala, estática, sobre o #app: a geometria
     gerada, os pivôs e as tabelas dos ponteiros continuam em espaço 1920x720 e não mudam, e o
     compositor rasteriza direto na escala final (sem transição, nada é redesenhado por quadro). */
  #app {
    position: relative; z-index: 1; width: 1920px; height: 720px; transition: opacity 0.25s ease;
    transform: scale(0.93); transform-origin: 960px 360px;
  }
  #app.hidden { opacity: 0; pointer-events: none; }
  body.yield-to-car { background-color: transparent; }

  #clusterSvg { position: absolute; inset: 0; width: 1920px; height: 720px; }

  /* ---------- Mostradores (decoração estática: traçada uma vez, nunca muda com telemetria) ---------- */
  .rim, .rim-hook { fill: none; stroke: rgba(236, 238, 242, 0.92); stroke-width: 2.5px; stroke-linecap: round; stroke-linejoin: round; }
  /* A faixa vermelha é um traço fino com um halo largo e fraco por baixo, mais viva embaixo e
     apagada em cima, como na referência. Sem filtro de desfoque: dois traços estáticos com
     gradiente custam uma pintura só. */
  .band { fill: none; stroke: url(#bandGradient); stroke-width: 3px; stroke-linecap: round; }
  .band-glow { fill: none; stroke: url(#bandGlowGradient); stroke-width: 14px; stroke-linecap: round; }
  .tick { fill: none; }
  .tick.major { stroke: rgba(240, 242, 245, 0.92); stroke-width: 3px; }
  .tick.minor { stroke: rgba(240, 242, 245, 0.26); stroke-width: 2px; }
  .guide { fill: none; stroke: none; }
  /* Números da escala: fixos. O zoom da marcação mais próxima foi desligado a pedido (6.9). */
  .tick-label {
    fill: var(--label); font-size: 36px; font-weight: 400; font-variant-numeric: tabular-nums;
    text-anchor: middle; dominant-baseline: middle;
  }
  .scale-unit { fill: var(--ink-dim); font-size: 24px; dominant-baseline: middle; }
  .readout-line { fill: none; stroke: rgba(236, 238, 242, 0.5); stroke-width: 2px; }

  /* ---------- Ponteiros ----------
     O aro não é um círculo, então o ponteiro não gira em volta de um eixo fixo: a ponta externa corre
     sobre o guia (o aro recuado 3 px) e o ponteiro aponta para o pivô, no miolo do mostrador. O
     ponteiro, o halo e o brilho são desenhados UMA vez, deitados no eixo x a partir da origem; cada
     atualização escreve um único transform (translate + rotate) no grupo. O grupo tem
     will-change, então o compositor move o raster pronto — nada é redesenhado por quadro, e não há
     drop-shadow: o brilho é um gradiente radial dentro do próprio grupo.
     `view-box` + origem 0 0: o translate vale no espaço de usuário do SVG (1920x720, 1:1 com px). */
  .needle-rot {
    transform-box: view-box;
    transform-origin: 0 0;
    will-change: transform;
    transition: transform 90ms linear;
  }
  @media (prefers-reduced-motion: reduce) { .needle-rot { transition: none; } }
  .needle { stroke: var(--needle); stroke-width: 4px; stroke-linecap: round; }
  .needle-halo { stroke: var(--needle); stroke-opacity: 0.3; stroke-width: 11px; stroke-linecap: round; }
  .needle-glow { fill: url(#needleGlowGradient); }

  /* Regeneração: barras verdes na base do mostrador direito, do lado de dentro do zero. Acesas e
     com o ponteiro verde só enquanto regenera; a classe troca quando o estado muda, não por quadro. */
  .regen-bars { fill: none; stroke: var(--regen); stroke-width: 6px; stroke-dasharray: 30 4; opacity: 0.28; transition: opacity 0.3s ease; }
  .regen-label { fill: var(--regen); font-size: 14px; font-weight: 700; letter-spacing: 2px; text-anchor: middle; dominant-baseline: middle; opacity: 0.4; transition: opacity 0.3s ease; }
  .power-dial.regen .regen-bars, .power-dial.regen .regen-label { opacity: 1; }
  .power-dial.regen .needle, .power-dial.regen .needle-halo { stroke: var(--regen); }
  .power-dial.regen .needle-glow { fill: url(#needleGlowRegenGradient); }

  /* ---------- Mini-mostradores (combustível à esquerda, bateria à direita) ----------
     Painel cinza que enche até o nível, marca laranja no nível e trecho vermelho de reserva no
     fundo. Nível só muda quando a telemetria de combustível/bateria muda — raro. */
  .side-panel-empty { fill: rgba(255, 255, 255, 0.035); }
  .side-sep { fill: none; stroke: rgba(0, 0, 0, 0.55); stroke-width: 2px; }
  .side-border { fill: none; stroke: rgba(220, 224, 230, 0.85); stroke-width: 2px; stroke-linecap: round; stroke-linejoin: round; }
  .side-border.inner { stroke: rgba(220, 224, 230, 0.4); stroke-width: 1.2px; }
  .side-reserve { fill: none; stroke: var(--reserve); stroke-width: 4px; stroke-linecap: round; }
  .side-marker { stroke: var(--marker); stroke-width: 4px; }
  .side-marker-glow { stroke: var(--marker); stroke-opacity: 0.3; stroke-width: 11px; }
  .side-label { fill: var(--label); font-size: 22px; font-weight: 400; text-anchor: middle; dominant-baseline: middle; }
  .side-symbol { fill: var(--ink-dim); }

  /* ---------- Leituras em HTML sobre o SVG ---------- */
  /* Velocidade: número alinhado à direita (o "km/h" não anda quando muda o número de dígitos), no
     miolo do velocímetro, em cima do traço fino. O ponteiro tem 175 px e fica colado no aro, então
     nunca chega aqui. */
  .speed-readout { position: absolute; left: 300px; top: 300px; width: 420px; display: flex; align-items: baseline; }
  .speed-readout .value { width: 240px; text-align: right; font-size: 92px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .speed-readout .unit { margin-left: 12px; font-size: 26px; color: var(--ink-dim); }

  /* Marcha e modo de condução: dentro do mostrador direito, espelhando a velocidade. */
  .gear-readout { position: absolute; left: 1140px; top: 300px; width: 400px; display: flex; justify-content: flex-end; align-items: baseline; }
  .gear-readout .drive-mode { margin-right: 26px; font-size: 26px; font-weight: 500; letter-spacing: 1px; color: var(--ink-dim); }
  .gear-readout .gear { font-size: 92px; font-weight: 700; line-height: 1; color: var(--ink); }

  /* Potência e rotação em número, embaixo do traço, fora do caminho do ponteiro (que desce até
     x ~1390 na regeneração). */
  .metric-readout { position: absolute; display: flex; align-items: baseline; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .power-readout { left: 1220px; top: 420px; }
  .power-readout .value { font-size: 52px; font-weight: 700; line-height: 1; }
  .power-readout.regen .value { color: var(--regen-light); }
  .rpm-readout { left: 1220px; top: 484px; }
  .rpm-readout .value { font-size: 42px; font-weight: 700; line-height: 1; }
  .metric-readout .unit { font-size: 20px; color: var(--ink-dim); margin-left: 6px; }
  .metric-readout .subunit { font-size: 15px; color: var(--ink-faint); margin-left: 6px; }

  /* Placa de limite: branca, aro vermelho, apoiada na linha de base do velocímetro. */
  .tsr-sign {
    position: absolute; left: 510px; top: 553px; width: 76px; height: 76px; box-sizing: border-box;
    border-radius: 50%; border: 7px solid #d71f2b; background: #f4f4f4;
    display: flex; align-items: center; justify-content: center;
  }
  .tsr-sign .value { color: #151515; font-size: 30px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }

  /* Rodapé: autonomia | hora | ODO | temperaturas | bateria. */
  .bottom-item { position: absolute; top: 634px; display: flex; align-items: baseline; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bottom-item .value { font-size: 40px; font-weight: 500; line-height: 1; color: var(--ink); }
  .bottom-item .value.small { font-size: 30px; }
  .bottom-item .unit { font-size: 24px; color: var(--ink-dim); margin-left: 6px; }
  .bottom-item .tag { font-size: 16px; font-weight: 600; letter-spacing: 1.5px; color: var(--ink-faint); margin-right: 8px; }
  .bottom-item .sep { width: 24px; }
  .bottom-item svg { align-self: center; fill: var(--ink-dim); }
  .range-readout { left: 146px; }
  .range-readout svg { width: 48px; height: 34px; margin-right: 10px; }
  .clock-readout { left: 417px; transform: translateX(-50%); }
  .odo-readout { left: 960px; transform: translateX(-50%); }
  .odo-readout .value { font-size: 30px; }
  .temp-readout { left: 1420px; }
  .battery-readout { right: 40px; }
  .battery-readout svg { width: 30px; height: 30px; margin-right: 10px; }

  .center-stage { position: absolute; top: 104px; left: 660px; width: 600px; height: 456px; }
</style>
</head>

  <div class="bottom-item battery-readout">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3,6h18c1.1,0,2,0.9,2,2v10c0,1.1-0.9,2-2,2H3c-1.1,0-2-0.9-2-2V8C1,6.9,1.9,6,3,6Zm0,2v10h18V8H3Z"></path><rect x="5" y="3" width="4" height="3"></rect><rect x="15" y="3" width="4" height="3"></rect><rect x="6" y="12" width="4" height="3"></rect><path d="M16,10h-2v2h-2v2h2v2h2v-2h2v-2h-2V10Z"></path></svg>
    <span id="batteryPctText" class="value">--</span><span class="unit">%</span>
  </div>

  <div class="center-stage"></div>
</div>

<script>
(function () {
  'use strict';

/* GERADO:inicio */
  // Gerado por scripts/gerar-bavarian-id7.mjs (valor -> fração do guia; pivôs; nível dos mini).
  const PIVO_VEL = { x: 456, y: 347 };
  const PIVO_POT = { x: 1464, y: 347 };
  const SPEED_TABLE = [[0, 0], [20, 0.1287], [40, 0.2451], [60, 0.3621], [100, 0.5405], [140, 0.6783], [200, 0.8299], [260, 1]];
  const POWER_TABLE = [[-100, 0], [0, 0.1142], [20, 0.2282], [40, 0.3314], [60, 0.4349], [80, 0.593], [100, 0.7152], [120, 0.8493], [140, 1]];
  const NIVEL = { cheio: 424, vazio: 601 };
  /* GERADO:fim */
  const SPEED_MAX = 260;
  const POWER_MAX = 140;
  const REGEN_MAX = 100;

  // value -> fração ao longo do guia; interpolação linear por trecho entre as posições numeradas.
  function lerpTable(table, v) {
    if (v <= table[0][0]) return table[0][1];
    const last = table[table.length - 1];
    if (v >= last[0]) return last[1];
    for (let i = 0; i < table.length - 1; i++) {
      const [v0, f0] = table[i], [v1, f1] = table[i + 1];
      if (v >= v0 && v <= v1) return f0 + (f1 - f0) * (v - v0) / (v1 - v0);
    }
    return last[1];
  }

  const els = {
    speedValue: document.getElementById('speedValue'),
    powerValue: document.getElementById('powerValue'),
    powerReadout: document.getElementById('powerReadout'),
    rpmValue: document.getElementById('rpmValue'),
    clock: document.getElementById('clock'),
    gearLetter: document.getElementById('gearLetter'),
    driveModeSub: document.getElementById('driveModeSub'),
    tsrValue: document.getElementById('tsrValue'),
    outTemp: document.getElementById('outTemp'),
    inTemp: document.getElementById('inTemp'),
    odometerValue: document.getElementById('odometerValue'),
    fuelRangeText: document.getElementById('fuelRangeText'),
    batteryPctText: document.getElementById('batteryPctText'),
    needleSpeedRot: document.getElementById('needleSpeedRot'),
    needlePowerRot: document.getElementById('needlePowerRot'),
    powerDial: document.querySelector('.power-dial'),
    fuelClipRect: document.getElementById('fuelFillClipRect'),
    batteryClipRect: document.getElementById('batteryFillClipRect'),
    fuelMarker: document.getElementById('fuelMarker'),
    batteryMarker: document.getElementById('batteryMarker'),
    app: document.getElementById('app'),
  };

  const speedGuide = document.querySelector('.speed-dial .guide');
  const powerGuide = document.querySelector('.power-dial .guide');

  // O comprimento do guia é constante — os dois <path> nunca mudam de `d`. Medir a cada
  // atualização obrigaria o WebView a esvaziar o layout pendente depois de o ponteiro anterior já
  // ter escrito (leitura-depois-de-escrita, layout síncrono forçado). Mede uma vez e guarda.
  const COMPRIMENTO_DO_GUIA = new WeakMap();
  function comprimento(pathEl) {
    let len = COMPRIMENTO_DO_GUIA.get(pathEl);
    if (len === undefined) { len = pathEl.getTotalLength(); COMPRIMENTO_DO_GUIA.set(pathEl, len); }
    return len;
  }

  // Um único transform por atualização: leva a origem do grupo (a ponta externa do ponteiro) até o
  // ponto do guia e gira o eixo x do grupo para o pivô.
  function aimNeedle(grupoEl, pivot, pathEl, frac) {
    const p = pathEl.getPointAtLength(Math.max(0, Math.min(1, frac)) * comprimento(pathEl));
    const deg = Math.atan2(pivot.y - p.y, pivot.x - p.x) * 180 / Math.PI;
    grupoEl.style.transform = 'translate(' + p.x.toFixed(1) + 'px, ' + p.y.toFixed(1) + 'px) rotate(' + deg.toFixed(2) + 'deg)';
  }

  function renderSpeedNeedle(speed) {
    const clamped = Math.max(0, Math.min(SPEED_MAX, speed));
    aimNeedle(els.needleSpeedRot, PIVO_VEL, speedGuide, lerpTable(SPEED_TABLE, clamped));
    els.speedValue.textContent = Math.round(clamped);
  }

  // Potência e regeneração dividem o mesmo mostrador: um valor só, com sinal. Positivo é consumo
  // (0-140, escala numerada); negativo é regeneração (o ponteiro passa do zero para a faixa verde
  // da base). Na tabela a regeneração entra como valor negativo, então é a mesma conta.
  let emRegen = false;
  function renderPowerNeedle(powerFactor) {
    const p = Number(powerFactor) || 0;
    const v = p >= 0 ? Math.min(POWER_MAX, p) : -Math.min(REGEN_MAX, -p);
    aimNeedle(els.needlePowerRot, PIVO_POT, powerGuide, lerpTable(POWER_TABLE, v));
    els.powerValue.textContent = Math.round(Math.abs(v));
    const regen = v < -3;
    if (regen !== emRegen) {
      emRegen = regen;
      els.powerDial.classList.toggle('regen', regen);
      els.powerReadout.classList.toggle('regen', regen);
    }
  }

  function renderRpm(rpm) {
    const v = (Number(rpm) || 0) / 1000;
    els.rpmValue.textContent = v.toFixed(1).replace('.', ',');
  }

  function nivelY(pct) {
    const f = Math.max(0, Math.min(100, Number(pct) || 0)) / 100;
    return NIVEL.vazio - f * (NIVEL.vazio - NIVEL.cheio);
  }
  function renderMini(clipRect, marcador, pct) {
    const y = nivelY(pct);
    clipRect.setAttribute('y', y.toFixed(1));
    clipRect.setAttribute('height', (NIVEL.vazio + 4 - y).toFixed(1));
    marcador.setAttribute('transform', 'translate(0 ' + y.toFixed(1) + ')');
  }

  function milhar(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function temperatura(t, sinal) {
    const txt = Math.abs(t).toFixed(1).replace('.', ',');
    if (t < 0 && Math.abs(t) >= 0.05) return '−' + txt;
    return (sinal && t >= 0.05 ? '+' : '') + txt;
  }

  function tickClock() {
    const now = new Date();
    els.clock.textContent = now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');
  }
  tickClock();
  setInterval(tickClock, 5000);

  const GEAR_LABELS = { '0': 'N', '1': 'N', '2': 'D', '3': 'P', '4': 'R' };
  const DRIVE_MODE_LABELS = { '0': 'Normal', '1': 'Sport', '2': 'Eco', '3': 'Neve', '4': 'Areia', '5': 'Lama', '11': 'AWD' };

  // ----- Coalescência de render: telemetria chega em evaluateJavascript separados; um só
  // requestAnimationFrame por quadro evita desenhar mais de uma vez por frame exibido. -----
  let pending = {};
  let renderScheduled = false;
  let renderFallbackTimer = 0;
  function flushRender() {
    renderScheduled = false;
    clearTimeout(renderFallbackTimer);
    if ('speed' in pending) { renderSpeedNeedle(pending.speed); delete pending.speed; }
    if ('rpm' in pending) { renderRpm(pending.rpm); delete pending.rpm; }
    if ('power' in pending) { renderPowerNeedle(pending.power); delete pending.power; }
  }
  function scheduleRender() {
    if (renderScheduled) return;
    renderScheduled = true;
    requestAnimationFrame(flushRender);
    // Rede de segurança: se o WebView estrangular o rAF (janela sem foco), o ponteiro não
    // pode congelar -- este timer destrava o desenho (mesmo padrão do Cupertino Ultra).
    renderFallbackTimer = setTimeout(flushRender, 120);
  }

  function handleTelemetry(key, rawValue) {
    switch (key) {
      case 'car.basic.vehicle_speed':
        pending.speed = parseFloat(rawValue) || 0;
        scheduleRender();
        break;
      case 'car.basic.engine_speed':
        pending.rpm = Number(rawValue) || 0;
        scheduleRender();
        break;
      case 'car.ev_info.energy_output_percentage':
        pending.power = parseFloat(rawValue) || 0;
        scheduleRender();
        break;
      case 'car.basic.remain_fuel_percentage':
        renderMini(els.fuelClipRect, els.fuelMarker, rawValue);
        break;
      case 'car.ev_info.cur_battery_power_percentage':
        renderMini(els.batteryClipRect, els.batteryMarker, rawValue);
        els.batteryPctText.textContent = Math.round(Number(rawValue) || 0);
        break;
      case 'car.ev_info.fuel_mode_remain_odometer':
        els.fuelRangeText.textContent = Math.round(Number(rawValue) || 0);
        break;
      case 'car.basic.total_odometer':
        els.odometerValue.textContent = milhar(Math.round(Number(rawValue) || 0));
        break;
      case 'car.basic.gear_status': {
        const g = String(parseInt(rawValue, 10));
        els.gearLetter.textContent = GEAR_LABELS[g] || 'N';
        break;
      }
      case 'car.basic.head_light_status': {
        // O app entrega aqui o estado JÁ RESOLVIDO (HeadlightPolicy): neste carro a chave mestra
        // do farol chega vazia e quem responde por ela é a luz baixa/alta. Do lado do tema é só
        // ligado/desligado.
        const aceso = rawValue === true || ['1', 'true', 'on', 'yes', 'ligado']
          .indexOf(String(rawValue == null ? '' : rawValue).trim().toLowerCase()) >= 0;
        document.body.classList.toggle('mode-headlight', aceso);
        break;
      }
      case 'car.drive_setting.drive_mode':
        els.driveModeSub.textContent = (DRIVE_MODE_LABELS[String(rawValue)] || 'Normal').toUpperCase();
        break;
      case 'car.basic.outside_temp': {
        const t = Number(rawValue);
        if (Number.isFinite(t)) els.outTemp.textContent = temperatura(t, true);
        break;
      }
      case 'car.basic.inside_temp': {
        const t = Number(rawValue);
        if (Number.isFinite(t)) els.inTemp.textContent = temperatura(t, false);
        break;
      }
      case 'car.map.tsr.nav_speed_limit': {
        const lim = parseFloat(rawValue);
        els.tsrValue.textContent = Number.isFinite(lim) && lim > 0 ? Math.round(lim) : '--';
        break;
      }
      case 'car.map.tsr.nav_speed_limit_sign_status': {
        const on = String(rawValue).trim() === '1';
        els.tsrValue.parentElement.style.visibility = on ? 'visible' : 'hidden';
        break;
      }
      case 'warningActive':
        warningActiveState = String(rawValue) === 'true';
        applyYieldToCar();
        break;
      default:
        break;
    }
  }

  // ===== Estado de projeção: o tema cede a tela inteira (fica transparente) quando o carro
  // está projetando CarPlay/Android Auto na tela do painel -- mesmo contrato do Cupertino Ultra
  // / Stuttgart NTG 5.5, nenhum tema pode cobrir isso. Aviso do veículo NÃO cede a tela. =====
  let warningActiveState = false;
  const projectionState = { carPlayInDash: false, projectionMirrorInDash: false, projectionPreparingD3: false };
  /*
   * O AVISO DO CARRO NÃO TIRA MAIS O TEMA DA TELA
   *
   * `warningActiveState` saiu desta conta de propósito. Enquanto ele estava aqui, QUALQUER aviso
   * do veículo -- cinto, porta entreaberta, pressão de pneu, revisão vencida -- deixava o corpo
   * transparente, e o que aparecia no lugar era a camada nativa: num tema com máscaras, só o
   * fundo; num tema sem elas, o painel de fábrica inteiro. Um aviso que fica ativo a viagem toda
   * (revisão, TPMS) simplesmente apagava o painel customizado para sempre.
   *
   * O painel customizado sobrepõe o de fábrica, sempre. O aviso continua chegando por
   * `warningActive` e o tema o desenha COM OS SEUS PRÓPRIOS elementos, por cima -- que é o que
   * mantém o alerta visível sem entregar a tela.
   *
   * O que continua cedendo a tela é só projeção de verdade (CarPlay/Android Auto/espelhamento):
   * ali a tela é do outro app, não há como desenhar por cima, e insistir mostraria o painel
   * antigo congelado sobre o vídeo.
   */
  function applyYieldToCar() {
    const yielding = projectionState.carPlayInDash ||
      projectionState.projectionMirrorInDash || projectionState.projectionPreparingD3;
    els.app.classList.toggle('hidden', yielding);
    document.body.classList.toggle('yield-to-car', yielding);
  }

  // ===== Vão da projeção da central (Alpha 9.5) =====
  // O centro, entre os dois mostradores, com as bordas embaixo das faces fumê (#projfumo), como no
  // NTG 5.5 (coffe3). Declarar faz o app pôr o vídeo POR BAIXO desta página; o #bg abre o buraco
  // (aplicarVaoDaProjecao) e os mostradores continuam por cima. Sem suporte a máscara, não declara:
  // o app volta ao modo antigo (vídeo por cima, com borda esmaecida).
  const PROJ_BOX = { x: 600, y: 60, w: 720, h: 560 };
  const PROJ_PENA_X = 96;
  const PROJ_PENA_Y = 56;

  function sabeRecortarOFundo() {
    try {
      if (!window.CSS || typeof window.CSS.supports !== 'function') return false;
      const g = 'linear-gradient(to right, #000 0px, transparent 10px)';
      return window.CSS.supports('-webkit-mask-image', g) || window.CSS.supports('mask-image', g);
    } catch (e) { return false; }
  }
  let recortaOFundo = null;
  function declararVaoDaProjecao() {
    if (recortaOFundo === null) {
      recortaOFundo = sabeRecortarOFundo();
      if (!recortaOFundo) console.warn('[BAVARIAN ID7] sem suporte a mascara: a projecao vai por cima do tema');
    }
    if (!recortaOFundo) return;
    try {
      if (window.Android && typeof window.Android.setProjectionBox === 'function') {
        window.Android.setProjectionBox(PROJ_BOX.x, PROJ_BOX.y, PROJ_BOX.w, PROJ_BOX.h);
      }
    } catch (e) { /* ponte antiga: sem declaração, o app volta a varrer o DOM */ }
  }
  function aplicarVaoDaProjecao(valor) {
    const bg = document.getElementById('bg');
    if (!bg) return;
    const n = String(valor == null ? '' : valor).split(',');
    const x = parseInt(n[0], 10), y = parseInt(n[1], 10);
    const l = parseInt(n[2], 10), a = parseInt(n[3], 10);
    if (n.length < 4 || !(l > 0) || !(a > 0)) {
      bg.style.webkitMaskImage = '';
      bg.style.maskImage = '';
      document.body.classList.remove('projetando');
      return;
    }
    const L = x, R = x + l, T = y, B = y + a;
    const px = Math.min(PROJ_PENA_X, Math.floor(l / 3));
    const py = Math.min(PROJ_PENA_Y, Math.floor(a / 3));
    const pe = L <= 0 ? 0 : px, pd = R >= 1920 ? 0 : px;
    const pt = T <= 0 ? 0 : py, pb = B >= 720 ? 0 : py;
    const gx = 'linear-gradient(to right, #000 ' + L + 'px, transparent ' + (L + pe) + 'px, transparent ' + (R - pd) + 'px, #000 ' + R + 'px)';
    const gy = 'linear-gradient(to bottom, #000 ' + T + 'px, transparent ' + (T + pt) + 'px, transparent ' + (B - pb) + 'px, #000 ' + B + 'px)';
    const veu = document.getElementById('projscrim');
    if (veu) {
      veu.style.left = L + 'px';
      veu.style.top = T + 'px';
      veu.style.width = l + 'px';
      veu.style.height = a + 'px';
      const mv = 'linear-gradient(to right, transparent 0px, #000 ' + pe + 'px, #000 ' + (l - pd) + 'px, transparent ' + l + 'px)';
      veu.style.webkitMaskImage = mv;
      veu.style.maskImage = mv;
    }
    bg.style.webkitMaskImage = gx + ', ' + gy;
    bg.style.maskImage = gx + ', ' + gy;
    document.body.classList.add('projetando');
  }

  const SUBSCRIBE_KEYS = [
    'car.basic.vehicle_speed',
    'car.basic.engine_speed',
    'car.ev_info.energy_output_percentage',
    'car.basic.remain_fuel_percentage',
    'car.ev_info.cur_battery_power_percentage',
    'car.ev_info.fuel_mode_remain_odometer',
    'car.basic.total_odometer',
    'car.basic.gear_status',
    'car.drive_setting.drive_mode',
    'car.basic.outside_temp',
    'car.basic.inside_temp',
    'car.map.tsr.nav_speed_limit',
    'car.map.tsr.nav_speed_limit_sign_status',
    'car.basic.head_light_status',
    'warningActive'
  ];

  function installMockBridge() {
    console.warn('[BAVARIAN ID7] window.Android ausente — usando simulação local para preview.');
    let mock = { speed: 0, dir: 1, power: 0, powerDir: 1 };
    window.Android = {
      getAvailableKeys: () => JSON.stringify(SUBSCRIBE_KEYS),
      subscribe: () => {}, unsubscribe: () => {},
      getCarData: () => '0', updateCarData: () => {},
      getPreference: (k, d) => d, savePreference: () => {},
      heartbeat: () => {}, triggerSystemAction: () => {},
      setAppDefaultDimensions: () => {},
    };
    const seed = {
      'car.basic.gear_status': '2',
      'car.drive_setting.drive_mode': '1',
      'car.basic.outside_temp': '26',
      'car.basic.inside_temp': '22',
      'car.ev_info.fuel_mode_remain_odometer': '455',
      'car.ev_info.cur_battery_power_percentage': '74',
      'car.basic.total_odometer': '11500',
      'car.basic.remain_fuel_percentage': '82',
      'car.map.tsr.nav_speed_limit': '30',
      'car.map.tsr.nav_speed_limit_sign_status': '1',
    };
    Object.keys(seed).forEach((k) => handleTelemetry(k, seed[k]));
    setInterval(() => {
      mock.speed += mock.dir * 1.4;
      if (mock.speed >= 250) mock.dir = -1;
      if (mock.speed <= 0) { mock.speed = 0; mock.dir = 1; }
      mock.power += mock.powerDir * 1.1;
      if (mock.power >= 130) mock.powerDir = -1;
      if (mock.power <= -60) mock.powerDir = 1;
      handleTelemetry('car.basic.vehicle_speed', mock.speed.toFixed(1));
      handleTelemetry('car.basic.engine_speed', String(Math.max(0, mock.speed * 32)));
      handleTelemetry('car.ev_info.energy_output_percentage', mock.power.toFixed(0));
    }, 120);
  }

  function initBridge() {
    if (!window.Android || typeof window.Android.subscribe !== 'function') installMockBridge();
    const prevOnDataChanged = window.onDataChanged;
    window.onDataChanged = function (key, value) {
      if (typeof prevOnDataChanged === 'function') { try { prevOnDataChanged(key, value); } catch (e) { console.error(e); } }
      handleTelemetry(key, value);
    };
    window.onCardChanged = function () {};

    const prevControl = window.control;
    window.control = function (key, value) {
      if (typeof prevControl === 'function') { try { prevControl(key, value); } catch (e) {} }
      if (Object.prototype.hasOwnProperty.call(projectionState, key)) {
        projectionState[key] = (value === true || value === 'true');
        applyYieldToCar();
        return;
      }
      if (key === 'projectionWindow') aplicarVaoDaProjecao(value);
    };

    try {
      if (window.Android && typeof window.Android.subscribe === 'function') {
        window.Android.subscribe(JSON.stringify(SUBSCRIBE_KEYS));
      }
      if (window.Android && typeof window.Android.setAppDefaultDimensions === 'function') {
        window.Android.setAppDefaultDimensions(0, 0, 1920, 720);
      }
      declararVaoDaProjecao();
    } catch (e) { console.error('[BAVARIAN ID7] bridge init failed:', e); }

    setInterval(() => {
      try { if (window.Android && typeof window.Android.heartbeat === 'function') window.Android.heartbeat(); } catch (e) {}
      // Redeclara a cada 2 s, como os outros temas do APK (Alpha 6.6): o app pode ter perdido a
      // declaração numa troca de tema ou num reinício do projetor.
      try { declararVaoDaProjecao(); } catch (e) { /* ignore */ }
    }, 2000);
  }

  renderSpeedNeedle(0);
  renderPowerNeedle(0);
  renderMini(els.fuelClipRect, els.fuelMarker, 0);
  renderMini(els.batteryClipRect, els.batteryMarker, 0);
  initBridge();
})();
</script>
