# Opções do build do DeepGWT. O que for definido pela IDE (Android Studio) vale mais que este arquivo.

# --- Memória ---
# O daemon do Gradle e o do Kotlin compilam o app inteiro (mais de 600 arquivos): precisam de folga.
org.gradle.jvmargs = -Xmx4096m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs = -Xmx4096m -XX:MaxMetaspaceSize=1024m

# --- Plugin do Android (AGP 9) ---
android.useAndroidX = true
android.nonTransitiveRClass = true
android.uniquePackageNames = false
android.dependency.useConstraints = true
android.r8.strictFullModeForKeepRules = false
android.generateSyncIssueWhenLibraryConstraintsAreEnabled = false
# O Kotlin vem do plugin `kotlin-android` declarado no catálogo, não do embutido no AGP 9: ligar os
# dois ao mesmo tempo dá conflito.
android.builtInKotlin = false
android.newDsl = false

# --- Versão do APK (o instalador e os roteiros leem estas duas chaves) ---
appVersionCode=101
appVersionName=Alpha 10.7.0 061020261436
