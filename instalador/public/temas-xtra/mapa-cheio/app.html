<html lang="pt-BR">
<head>

<title>Mapa Cheio</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #root { position: absolute; left: 0; top: 0; width: 1920px; height: 720px;
    transform-origin: 0 0; overflow: hidden; }

  #root { background: #0b0e12; color: #e9eef4;
    font-family: "Helvetica Neue", -apple-system, Arial, sans-serif; }
  #ov { position: absolute; left: 0; top: 0; width: 1920px; height: 720px; }
  /* O oposto do painel virtual: aqui o mapa não pede licença, toma a tela toda
     e os instrumentos viram fichas flutuantes nos cantos. Vidro fosco por cima
     do mapa, para o número não brigar com a malha de ruas embaixo. */
  .water  { fill: #143349; }
  .park   { fill: #1a3324; }
  .block  { fill: #1e242d; }
  .st1    { stroke: #12161b; fill: none; stroke-width: 3; }
  .st2    { stroke: #2e3944; fill: none; stroke-width: 7; }
  .st3    { stroke: #46535f; fill: none; stroke-width: 13; }
  .routeu { fill: none; stroke: #0f2740; stroke-width: 28; stroke-linejoin: round;
    stroke-linecap: round; }
  .route  { fill: none; stroke: #4f9dff; stroke-width: 16; stroke-linejoin: round;
    stroke-linecap: round; }
  .chip { position: absolute; border-radius: 20px; padding: 18px 26px;
    background: rgba(12,16,21,.74); border: 1px solid rgba(255,255,255,.09);
    backdrop-filter: blur(16px) saturate(150%); }
  .chip .k { font-size: 11px; letter-spacing: .3em; color: #8b98a6; text-transform: uppercase; }
  .chip .v { font-size: 46px; font-weight: 200; margin-top: 4px; line-height: 1; }
  #spd { left: 70px; top: 64px; padding: 24px 36px; }
  #spd .v { font-size: 122px; letter-spacing: -6px; }
  #spd .u { font-size: 12px; letter-spacing: .5em; color: #8b98a6; margin-top: 4px;
    text-transform: uppercase; }
  #turn { right: 70px; top: 64px; width: 420px; }
  #turn .v { font-size: 26px; font-weight: 300; line-height: 1.25; }
  #lim { left: 70px; bottom: 64px; display: flex; gap: 40px; }
  #eta { right: 70px; bottom: 64px; text-align: right; display: flex; gap: 40px; }
  .chip .c { min-width: 108px; }
</style>
</head>
<body>
<div id="root">

  <svg id="ov" viewBox="0 0 1920 720">
    <g id="city"></g>
    <path id="routeu" class="routeu"></path>
    <path id="route" class="route"></path>
    <g id="me">
      <circle cx="960" cy="470" r="30" fill="#4f9dff" opacity=".2"></circle>
      <path fill="#eaf2fb" d="M960 442 l24 50 -24 -15 -24 15 Z"></path>
    </g>
  </svg>
  <div class="chip" id="spd"><div class="k">velocidade</div><div class="v" id="sv">0</div>
    <div class="u">km/h</div></div>
  <div class="chip" id="turn"><div class="k">próxima manobra</div><div class="v" id="tv">—</div></div>
  <div class="chip" id="lim"></div>
  <div class="chip" id="eta"></div>
</div>

<script>
/* ============================================================================
   Núcleo comum dos temas DeepGWT — contrato v1.0 (núcleo v1.2)
   ----------------------------------------------------------------------------
   Faz o que TODO tema é obrigado a fazer, e nada além:

   1. ASSINATURA — só pede chaves que `ThemeBridgeImpl.getAvailableKeys()`
      declara; qualquer outra é recusada com "Blocked subscription to
      undeclared theme key" e o mostrador fica com o dado velho para sempre.
      O núcleo ainda cruza a lista pedida com a que o host informa e avisa no
      console o que ficou de fora, em vez de deixar o campo morto na tela.

   2. CEDER A TELA — o painel é do carro, não do tema. Ele some inteiro quando:
        • `warningActive`            -> o carro abriu o popup de aviso;
        • projeção no painel         -> CarPlay / Android Auto / espelhamento;
        • `appInDash`                -> um app foi colocado no painel e o host
                                        abriu um buraco na máscara para ele.
      ATENÇÃO AO CANAL: `warningActive` e `warningDismissed` chegam como STRING
      ("true"/"false") uma única vez, no subscribe, e depois SÓ como booleano
      de verdade por `window.control(...)` -- é o que
      `InstrumentProjector2.pushWarningStateToTheme()` chama. Um tema que só
      escuta `onDataChanged` nunca fica sabendo do aviso e continua desenhando
      por cima do popup do carro. `bsdLeft`/`bsdRight` são control-only também.

   3. AVISO PENDENTE — depois que o motorista fecha o popup do carro (BACK), o
      aviso continua ativo mas nada mais aparece. O núcleo conta os avisos que
      levantam a tarja (mesmo conjunto de `ClusterWarningPolicy`, sem os
      transitórios) e mantém uma pílula discreta, para o tema não fingir que
      está tudo bem.

   4. RITMO — `Android.heartbeat()` a cada 2s (sem isso o projetor derruba a
      página) e uma pintura por quadro, com rede de segurança de 140ms porque a
      telemetria chega em `evaluateJavascript` separados, uma chave por vez.

   5. SIMULAÇÃO — quando `window.Android` não existe o tema abre no navegador do
      Mac exatamente como abre no painel (`?photo=1` congela o quadro).
   ============================================================================ */
(function () {
  'use strict';

  var S = Object.create(null);          // último valor bruto por chave
  var cfg = null;
  var scheduled = false, fbTimer = 0, animating = false, yielding = false;
  var warningActive = false, warningDismissed = false;
  var projection = { carPlayInDash: false, projectionMirrorInDash: false, projectionPreparingD3: false };
  var appInDash = false;
  var EASE = Object.create(null);
  var warnEl = null, warnTxtEl = null, mocked = false;

  function truthy(v) {
    if (v === true) return true;
    if (v === false || v === null || v === undefined) return false;
    var s = String(v).trim().toLowerCase();
    return s === 'true' || s === '1' || s === 'on' || s === 'yes' || s === 'left' || s === 'right';
  }

  /* ---- leitura de estado -------------------------------------------------- */
  function num(k, d) { var v = parseFloat(S[k]); return isFinite(v) ? v : (d === undefined ? 0 : d); }
  function str(k, d) { var v = S[k]; return (v === undefined || v === null || v === '') ? (d === undefined ? '' : d) : String(v); }
  function on(k) { return truthy(S[k]); }
  function has(k) { return S[k] !== undefined && S[k] !== ''; }

  /* ---- matemática de mostrador -------------------------------------------- */
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function polar(cx, cy, r, deg) { var a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }
  function arcPath(cx, cy, r, a0, a1) {
    var p0 = polar(cx, cy, r, a0), p1 = polar(cx, cy, r, a1);
    var large = Math.abs(a1 - a0) > 180 ? 1 : 0;
    var sweep = a1 > a0 ? 1 : 0;
    return 'M' + p0[0].toFixed(2) + ' ' + p0[1].toFixed(2) + 'A' + r + ' ' + r + ' 0 ' + large + ' ' + sweep + ' ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2);
  }
  function fmt(v, d) { return (isFinite(v) ? v : 0).toFixed(d || 0); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  /* ---- amortecimento -------------------------------------------------------
     A telemetria não chega suave: a velocidade pula de 60 para 63, o giro de
     2250 para 2600. Ponteiro e barra que saltam desses degraus ficam nervosos
     no canto do olho. Cada valor animado persegue o alvo com constante de tempo
     própria e o núcleo continua pedindo quadros enquanto não assenta. */
  function ease(name, target, tau) {
    if (!isFinite(target)) target = 0;
    var now = (window.performance && performance.now) ? performance.now() : Date.now();
    var e = EASE[name];
    if (!e) { EASE[name] = { v: target, t: now }; return target; }
    var dt = clamp((now - e.t) / 1000, 0, 0.25); e.t = now;
    var k = 1 - Math.exp(-dt / (tau || 0.16));
    e.v += (target - e.v) * k;
    var tol = Math.max(0.02, Math.abs(target) * 0.0008);
    if (Math.abs(target - e.v) <= tol) e.v = target; else animating = true;
    return e.v;
  }

  /* ---- dicionários confirmados nos temas de fábrica ----------------------- */
  var GEAR = { '0': 'N', '1': 'N', '2': 'D', '3': 'P', '4': 'R' };
  var MODE = { '0': 'Normal', '1': 'Sport', '2': 'Eco', '3': 'Neve', '4': 'Areia', '5': 'Lama', '11': 'AWD' };
  var POWERMODE = { '0': 'HEV', '1': 'EVP', '3': 'EV' };
  function gear() { return GEAR[String(parseInt(S['car.basic.gear_status'], 10))] || 'N'; }
  function mode() { return MODE[String(S['car.drive_setting.drive_mode'])] || 'Normal'; }
  function powerMode() { return POWERMODE[String(S['car.ev_setting.power_model_config'])] || 'HEV'; }
  /* O host manda a hora do carro por control('clockTime', 'HH:MM'); só cai no
     relógio do próprio WebView enquanto essa mensagem não chega. */
  function clock() {
    var t = S['__clockTime'];
    if (t) return String(t);
    var d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  /* Limite da via: só vale com a placa confirmada pela câmera. O valor bruto ainda
     não foi conferido neste veículo (pode vir em km/h ou como código), então ele é
     repassado como está — mesma postura do Cupertino Ultra. */
  function roadLimit() {
    var ok = on('car.map.tsr.nav_speed_limit_sign_status');
    var v = num('car.map.tsr.nav_speed_limit', 0);
    return (ok && v > 0) ? Math.round(v) : null;
  }

  /* ---- atalhos de chave ----------------------------------------------------
     As mesmas 20 chaves aparecem em quase todo tema. Escrever a string inteira
     em 40 arquivos é convite a erro de digitação -- e uma chave com erro é
     recusada em silêncio pelo bridge, virando campo morto na tela. */
  var K = {
    spd: 'car.basic.vehicle_speed', rpm: 'car.basic.engine_speed',
    gear: 'car.basic.gear_status', mode: 'car.drive_setting.drive_mode',
    fuel: 'car.basic.remain_fuel_percentage', soc: 'car.ev_info.cur_battery_power_percentage',
    odo: 'car.basic.total_odometer', out: 'car.basic.outside_temp', ins: 'car.basic.inside_temp',
    unit: 'car.configure.default_temp_unit', cons: 'car.basic.instant_fuel_consumption',
    kwh: 'car.ev_info.Instant_energy_consumption', flow: 'car.ev_info.energy_output_percentage',
    volt: 'car.ev_info.power_battery_voltage', amp: 'car.ev_info.cur_charge_current',
    rngE: 'car.ev_info.electric_mode_remain_odometer', rngF: 'car.ev_info.fuel_mode_remain_odometer',
    head: 'car.basic.head_light_status', esp: 'car.drive_setting.esp_enable',
    engine: 'car.basic.engine_state', pwr: 'car.ev_setting.power_model_config',
    recov: 'car.ev_setting.energy_recovery_level', pedal: 'car.ev.setting.pedal_control_enable',
    steer: 'car.drive_setting.steering_wheel_assist_mode',
    limit: 'car.map.tsr.nav_speed_limit', limitOk: 'car.map.tsr.nav_speed_limit_sign_status',
    radio: 'sys.radio.cur_channel_info',
    mTitle: 'app.media.title', mArtist: 'app.media.artist', mAlbum: 'app.media.album',
    mArt: 'app.media.album_art', mState: 'app.media.state',
    mPos: 'app.media.position', mDur: 'app.media.duration',
    pState: 'app.phone.state', pName: 'app.phone.caller_name', pNum: 'app.phone.caller_number',
    nav: 'app.navigation.directions', app3: 'app.display.3.active_app_label',
    hvacT: 'car.hvac.driver_temperature', hvacFan: 'car.hvac.fan_speed',
    hvacAuto: 'car.hvac.auto_enable', hvacCycle: 'car.hvac.cycle_mode',
    hvacPwr: 'car.hvac.power_mode', hvacIon: 'car.hvac.anion_enable'
  };
  function spd() { return num(K.spd); }
  function rpm() { return num(K.rpm); }
  function fuelPct() { return clamp(num(K.fuel), 0, 100); }
  function socPct() { return clamp(num(K.soc), 0, 100); }
  /* 1 = Fahrenheit no carro; o tema mostra na unidade que o motorista escolheu. */
  function tempF() { return String(S[K.unit]) === '1'; }
  function temp(k, d) { var v = num(k, d); return tempF() ? v * 9 / 5 + 32 : v; }
  function tempU() { return tempF() ? '°F' : '°C'; }

  /* ---- ferramentas de desenho --------------------------------------------- */
  function E(id) { return document.getElementById(id); }
  function attr(el, o) { for (var k in o) el.setAttribute(k, o[k]); return el; }
  /* Gira um elemento SVG em torno de um ponto -- ponteiro de mostrador. */
  function rot(el, deg, cx, cy) {
    if (el) el.setAttribute('transform', 'rotate(' + deg.toFixed(2) + ' ' + cx + ' ' + cy + ')');
  }
  /* Marcas radiais de um mostrador inteiro em UM path: n+1 traços entre a0 e a1.
     Um <line> por marca custa dezenas de nós no DOM e o WebView do painel sente. */
  function ticks(cx, cy, r0, r1, a0, a1, n) {
    var d = '', i, a, p, q;
    for (i = 0; i <= n; i++) {
      a = a0 + (a1 - a0) * i / n;
      p = polar(cx, cy, r0, a); q = polar(cx, cy, r1, a);
      d += 'M' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + 'L' + q[0].toFixed(1) + ' ' + q[1].toFixed(1);
    }
    return d;
  }
  /* Ponteiro desenhado APONTANDO PARA CIMA a partir da origem (0,0): a mesma
     forma serve para qualquer mostrador, e girar é só compor a translação. */
  function pin(el, cx, cy, deg) {
    if (el) el.setAttribute('transform', 'translate(' + cx + ',' + cy + ') rotate(' + deg.toFixed(2) + ')');
  }
  /* Numeração de um mostrador: n+1 rótulos distribuídos entre a0 e a1. */
  function nums(svg, cx, cy, r, a0, a1, n, label, cls, dy) {
    var NS = 'http://www.w3.org/2000/svg';
    for (var i = 0; i <= n; i++) {
      var txt = label(i, n);
      if (txt === null || txt === undefined || txt === '') continue;
      var p = polar(cx, cy, r, n === 0 ? a0 : a0 + (a1 - a0) * i / n);
      var t = document.createElementNS(NS, 'text');
      t.setAttribute('x', p[0].toFixed(1));
      t.setAttribute('y', (p[1] + (dy === undefined ? 10 : dy)).toFixed(1));
      if (cls) t.setAttribute('class', cls);
      t.textContent = txt;
      svg.appendChild(t);
    }
  }
  /* Arco preenchido por fração usando dasharray: o path fica fixo, só o traço anda. */
  function dash(el, r, a0, a1, frac) {
    if (!el) return;
    var len = Math.abs(a1 - a0) * Math.PI / 180 * r;
    el.style.strokeDasharray = len.toFixed(1) + ' ' + (len * 4).toFixed(1);
    el.style.strokeDashoffset = (len * (1 - clamp(frac, 0, 1))).toFixed(1);
  }

  /* ---- avisos do carro -----------------------------------------------------
     `updateWarning(chave, valor)` é chamado pelo host para cada chave vigiada.
     É informativo: quem manda na tarja é `warningActive`. O conjunto abaixo é o
     mesmo que levanta a tarja em ClusterWarningPolicy -- os transitórios (ponto
     cego, FCW, FCTA, DOW, TTS) e os crônicos (revisão, pressão/temperatura de
     pneu) ficam de fora de propósito: piscariam a pílula a cada ultrapassagem
     ou ficariam acesos para sempre. */
  var WARN_LABEL = {
    'car.basic.coolant_temp_warning': 'Temperatura',
    'car.basic.engine_oil_low_pressure_warning': 'Pressão do óleo',
    'car.ipk_light.engine_oil_low_pressure_warning': 'Pressão do óleo',
    'car.basic.oil_low_warning': 'Nível de óleo',
    'car.basic.fatigue_warning': 'Fadiga',
    'car.basic.seat_belt_warning': 'Cinto',
    'car.basic.tpms_warning': 'Pneus',
    'car.ipk_light.tpms_warning': 'Pneus',
    'car.ipk_light.door_warning': 'Porta aberta',
    'car.ipk_light.fuel_low': 'Combustível'
  };
  var warnRaw = Object.create(null);
  function warnValueActive(v) {
    if (v === null || v === undefined) return false;
    var s = String(v).trim().toLowerCase();
    return s !== '' && s !== '0' && s !== 'false' && s !== 'null' && s !== 'undefined' &&
      s !== 'unknown' && s !== '--' && s !== 'nan' && s !== '{0,0,0,0}' && s !== '{0,0,0,0,0}';
  }
  function warnLabels() {
    var seen = {}, out = [];
    for (var k in warnRaw) {
      var lbl = WARN_LABEL[k];
      if (!lbl || !warnValueActive(warnRaw[k])) continue;
      if (seen[lbl]) continue;
      seen[lbl] = 1; out.push(lbl);
    }
    return out;
  }
  function paintWarnPill() {
    if (!warnEl) return;
    var l = warnLabels();
    var show = l.length > 0 && !yielding;
    warnEl.classList.toggle('on', show);
    if (show) warnTxtEl.textContent = l.length === 1 ? l[0] : (l.length + ' avisos ativos');
  }

  /* ---- pintura ------------------------------------------------------------ */
  function flush() {
    scheduled = false;
    clearTimeout(fbTimer);
    if (yielding) return;                // escondido não pinta: nada a mostrar, nada a gastar
    animating = false;
    try { cfg.paint(); } catch (e) { console.error('[DEEPGWT] paint falhou:', e); }
    paintWarnPill();
    if (animating) schedule();           // ainda assentando: pede o próximo quadro
  }
  function schedule() {
    if (scheduled || yielding) return;
    scheduled = true;
    requestAnimationFrame(flush);
    // Rede de segurança: o WebView estrangula o rAF quando a janela perde foco e
    // o painel congelaria no meio de uma curva. Mesmo padrão do Cupertino Ultra.
    fbTimer = setTimeout(flush, 140);
  }

  function apply(key, value) {
    S[key] = value;
    if (cfg.onData) { try { cfg.onData(key, value); } catch (e) {} }
    schedule();
  }

  /* ---- cede a tela ao carro ----------------------------------------------- */
  function yieldToCar() {
    var y = warningActive || appInDash ||
      projection.carPlayInDash || projection.projectionMirrorInDash || projection.projectionPreparingD3;
    if (y === yielding) return;
    yielding = y;
    var r = document.getElementById('root');
    if (r) r.classList.toggle('yielded', y);
    document.body.classList.toggle('yield-to-car', y);
    if (y) {
      if (warnEl) warnEl.classList.remove('on');
    } else {
      EASE = Object.create(null);        // volta já no valor certo, sem varrer a tela
      schedule();
    }
  }

  /* ---- modo dia/noite ------------------------------------------------------ */
  var displayMode = '';
  function pollDisplayMode() {
    var raw;
    try { raw = String(window.Android.getPreference('displayMode', 'Dia') || 'Dia'); } catch (e) { raw = 'Dia'; }
    var m = raw.trim().toLowerCase().indexOf('noi') === 0 ? 'noite' : 'dia';
    // O farol aceso puxa o painel para o modo noturno sozinho, como num carro de verdade,
    // mas só quando o usuário não fixou o modo na tela de configurações do tema.
    if (cfg.headlightDrivesNight && !has('__modeFixed') && on('car.basic.head_light_status')) m = 'noite';
    if (m === displayMode) return;
    displayMode = m;
    document.body.dataset.mode = m;
    schedule();
  }

  /* ---- simulação para preview no Mac --------------------------------------- */
  function installMock() {
    console.warn('[DEEPGWT] window.Android ausente — simulação local.');
    window.Android = {
      getAvailableKeys: function () { return JSON.stringify(cfg.keys); },
      subscribe: function () {}, unsubscribe: function () {},
      getCarData: function (k) { return S[k] === undefined ? '' : String(S[k]); },
      updateCarData: function () {}, getPreference: function (k, d) { return d; },
      savePreference: function () {}, saveSetting: function () {}, heartbeat: function () {},
      triggerSystemAction: function () {}, setAppDefaultDimensions: function () {},
      setWarningActive: function () {}, setCardId: function () {}
    };
    var photo = /[?&]photo=1/.test(location.search);
    var seed = cfg.photo || {};
    Object.keys(seed).forEach(function (k) {
      S[k] = String(seed[k]);
      if (cfg.onData) { try { cfg.onData(k, S[k]); } catch (e) {} }
    });
    schedule();
    if (photo || !cfg.mock) return;                    // ?photo=1 congela o quadro
    setInterval(function () {
      if (yielding) return;
      var t = Date.now() / 1000;
      var d = cfg.mock(t) || {};
      Object.keys(d).forEach(function (k) {
        S[k] = String(d[k]);
        if (cfg.onData) { try { cfg.onData(k, S[k]); } catch (e) {} }
      });
      schedule();
    }, 100);
  }

  /* ---- escala: 1920x720 é o painel; no Mac cabe na janela ------------------ */
  function fit() {
    var r = document.getElementById('root');
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 720);
    r.style.transform = 'translate(' + ((window.innerWidth - 1920 * s) / 2).toFixed(1) + 'px,' +
      ((window.innerHeight - 720 * s) / 2).toFixed(1) + 'px) scale(' + s + ')';
  }

  /* ---- folha de estilo do núcleo ------------------------------------------- */
  function injectCoreCss() {
    var css = [
      /* dígito que não dança: sem largura tabular o hodômetro treme a cada km */
      '#root{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"lnum" 1}',
      /* ceder tem de ser instantâneo e total -- nada de transição, nada de fundo */
      '#root.yielded{opacity:0!important;visibility:hidden!important;transition:none!important;pointer-events:none!important}',
      'body.yield-to-car{background:transparent!important}',
      'body.yield-to-car #root{background:transparent!important}',
      '.gw-warn{position:absolute;display:none;align-items:center;gap:11px;padding:9px 20px 10px 12px;',
      'border-radius:999px;background:rgba(255,168,38,.15);border:1px solid rgba(255,168,38,.55);',
      'color:#ffc266;font-family:-apple-system,"SF Pro Text",Roboto,Arial,sans-serif;font-size:19px;',
      'font-weight:600;letter-spacing:.085em;text-transform:uppercase;white-space:nowrap;z-index:9999;',
      '-webkit-backdrop-filter:blur(10px) saturate(140%);backdrop-filter:blur(10px) saturate(140%)}',
      '.gw-warn.on{display:flex}',
      /* em tema claro a pílula translúcida some no papel: vira âmbar sólida */
      '.gw-warn.lt{background:rgba(255,168,38,.94);border-color:#b9791a;color:#241400}',
      '.gw-warn.lt i{background:#241400;color:#ffc266}',
      '.gw-warn i{display:inline-flex;width:24px;height:24px;border-radius:50%;background:#ffa826;color:#1b1000;',
      'align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:16px;letter-spacing:0}'
    ].join('');
    var s = document.createElement('style');
    s.id = 'gw-core-css';
    s.textContent = css;
    document.head.appendChild(s);
  }

  function buildWarnPill() {
    var pos = cfg.warn || {};
    if (pos.hidden) return;
    warnEl = document.createElement('div');
    warnEl.className = 'gw-warn';
    warnEl.style.left = (pos.x === undefined ? 960 : pos.x) + 'px';
    warnEl.style.top = (pos.y === undefined ? 14 : pos.y) + 'px';
    warnEl.style.transform = 'translateX(-50%)';
    if (pos.light) warnEl.classList.add('lt');
    warnEl.innerHTML = '<i>!</i><span></span>';
    warnTxtEl = warnEl.lastChild;
    (document.getElementById('root') || document.body).appendChild(warnEl);
  }

  /* Atalhos de conferência no Mac (não têm efeito no carro, onde window.Android
     existe): ?yield=1 simula o popup de aviso do carro -- a tela tem de ficar
     vazia; ?warn=1 simula dois avisos ativos já dispensados -- a pílula tem de
     aparecer e nada mais pode mudar de lugar. */
  function previewFlags() {
    if (!mocked) return;
    if (/[?&]yield=1/.test(location.search)) window.control('warningActive', true);
    if (/[?&]warn=1/.test(location.search)) {
      window.updateWarning('car.basic.seat_belt_warning', '1');
      window.updateWarning('car.ipk_light.door_warning', '1');
    }
    if (/[?&]bsd=1/.test(location.search)) { window.control('bsdLeft', true); window.control('bsdRight', true); }
  }

  function init(config) {
    cfg = config;
    document.body.dataset.mode = 'dia';
    injectCoreCss();
    buildWarnPill();
    fit();
    window.addEventListener('resize', fit);

    if (!window.Android || typeof window.Android.subscribe !== 'function') { mocked = true; installMock(); }

    var prevData = window.onDataChanged;
    window.onDataChanged = function (key, value) {
      if (typeof prevData === 'function') { try { prevData(key, value); } catch (e) {} }
      // Valor inicial do subscribe: chega como a STRING "true"/"false".
      if (key === 'warningActive') { warningActive = String(value) === 'true'; yieldToCar(); return; }
      if (key === 'warningDismissed') { warningDismissed = String(value) === 'true'; return; }
      apply(key, value);
    };
    window.onCardChanged = function () {};

    // Único caminho vivo de warningActive/warningDismissed/bsd/appInDash.
    var prevControl = window.control;
    window.control = function (key, value) {
      if (typeof prevControl === 'function') { try { prevControl(key, value); } catch (e) {} }
      if (Object.prototype.hasOwnProperty.call(projection, key)) {
        projection[key] = truthy(value); yieldToCar(); return;
      }
      if (key === 'warningActive') { warningActive = truthy(value); yieldToCar(); return; }
      if (key === 'warningDismissed') { warningDismissed = truthy(value); schedule(); return; }
      if (key === 'appInDash') { appInDash = truthy(value); yieldToCar(); return; }
      if (key === 'bsdLeft' || key === 'bsdRight') { S[key] = truthy(value) ? '1' : '0'; schedule(); return; }
      if (key === 'clockTime') { S['__clockTime'] = String(value || ''); schedule(); return; }
      // As demais chaves de control são do fluxo de cartões do host; ignorar em
      // silêncio (o polyfill do host logaria uma linha por evento no disco).
    };

    window.updateWarning = function (key, value) {
      warnRaw[key] = value;
      schedule();
    };

    try { if (cfg.setup) cfg.setup(); } catch (e) { console.error('[DEEPGWT] setup falhou:', e); }

    // Só pede o que este host aceita: uma chave fora da lista viraria campo morto.
    var want = cfg.keys.concat(['warningActive', 'warningDismissed']);
    try {
      var host = JSON.parse(window.Android.getAvailableKeys() || '[]');
      if (host && host.length) {
        var allowed = want.filter(function (k) { return host.indexOf(k) >= 0; });
        var dropped = want.filter(function (k) { return host.indexOf(k) < 0; });
        if (dropped.length) console.warn('[DEEPGWT] fora do contrato deste host:', dropped.join(', '));
        if (allowed.length) want = allowed;
      }
    } catch (e) { /* host antigo sem getAvailableKeys: manda a lista original */ }

    try {
      window.Android.subscribe(JSON.stringify(want));
      window.Android.setAppDefaultDimensions(0, 0, 1920, 720);
    } catch (e) { console.error('[DEEPGWT] bridge init falhou:', e); }

    previewFlags();

    pollDisplayMode();
    setInterval(pollDisplayMode, 2000);
    setInterval(function () { try { window.Android.heartbeat(); } catch (e) {} }, 2000);
    setInterval(schedule, 1000);        // relógio e afins
    schedule();
  }

  window.GW = {
    init: init, num: num, str: str, on: on, has: has, clamp: clamp, lerp: lerp, ease: ease,
    polar: polar, arcPath: arcPath, fmt: fmt, pad2: pad2, gear: gear, mode: mode,
    powerMode: powerMode, clock: clock, roadLimit: roadLimit, schedule: schedule,
    warnings: warnLabels, state: S, GEAR: GEAR, MODE: MODE, K: K,
    spd: spd, rpm: rpm, fuelPct: fuelPct, socPct: socPct,
    temp: temp, tempU: tempU, tempF: tempF,
    E: E, attr: attr, rot: rot, pin: pin, ticks: ticks, nums: nums, dash: dash,
    yielding: function () { return yielding; }
  };
})();

</script>

<script>
(function () {
  var E = GW.E, K = GW.K;

  var sd = 90211;
  function rnd() { sd = (sd * 1103515245 + 12345) % 2147483648; return sd / 2147483648; }

  GW.init({
    keys: [
      K.spd, K.gear, K.fuel, K.rngF, K.out, K.limit, K.limitOk, K.nav, K.unit
    ],
    warn: { x: 660, y: 300 },
    photo: {
      [K.spd]: 54, [K.gear]: 2, [K.fuel]: 58, [K.rngF]: 438, [K.out]: 23, [K.limit]: 80,
      [K.limitOk]: 1, [K.nav]: 'à esquerda em 260 m · R. da Consolação', [K.unit]: 0
    },

    setup: function () {
      /* Cidade determinística: rio em diagonal, um parque, quarteirões de
         tamanho variável e três larguras de rua. Tudo com semente fixa. */
      var c = '<path class="water" d="M-40 690 L360 250 L470 250 L120 720 Z"></path>' +
              '<rect class="park" x="1380" y="120" width="300" height="220" rx="16"></rect>';
      var x, y, st1 = '', st2 = '', st3 = '';
      for (y = 0; y < 8; y++)
        for (x = 0; x < 20; x++) {
          if (rnd() < 0.14) continue;
          var bx = 40 + x * 98, by = 30 + y * 92;
          if (bx > 1360 && bx < 1700 && by > 100 && by < 350) continue;
          if (bx + by * 0.9 < 700) continue;
          c += '<rect class="block" x="' + bx + '" y="' + by + '" width="' +
            (58 + rnd() * 26).toFixed(0) + '" height="' + (50 + rnd() * 24).toFixed(0) +
            '" rx="3"></rect>';
        }
      for (x = 0; x <= 20; x++) {
        var vx = 24 + x * 98;
        (x % 5 === 0 ? (st3 += 'M' + vx + ' -10L' + vx + ' 730')
          : (x % 2 ? (st2 += 'M' + vx + ' -10L' + vx + ' 730')
                   : (st1 += 'M' + vx + ' -10L' + vx + ' 730')));
      }
      for (y = 0; y <= 8; y++) {
        var hy = 16 + y * 92;
        (y % 4 === 0 ? (st3 += 'M-10 ' + hy + 'L1930 ' + hy)
          : (y % 2 ? (st2 += 'M-10 ' + hy + 'L1930 ' + hy)
                   : (st1 += 'M-10 ' + hy + 'L1930 ' + hy)));
      }
      c += '<path class="st1" d="' + st1 + '"></path>' +
           '<path class="st2" d="' + st2 + '"></path>' +
           '<path class="st3" d="' + st3 + '"></path>';
      E('city').innerHTML = c;
      var rt = 'M960 700L960 476L960 384L1220 384L1220 200L1514 200L1514 108';
      E('route').setAttribute('d', rt);
      E('routeu').setAttribute('d', rt);
    },

    mock: function (t) {
      var o = {};
      o[K.spd] = (58 + 26 * Math.sin(t / 9)).toFixed(1);
      o[K.nav] = 'à esquerda em 260 m · R. da Consolação';
      return o;
    },

    paint: function () {
      E('sv').textContent = GW.fmt(GW.spd(), 0);
      E('tv').textContent = GW.str(K.nav, 'sem rota ativa');
      function c(k, v) { return '<div class="c"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>'; }
      E('lim').innerHTML = c('limite', GW.roadLimit() || '—') +
        c('marcha', GW.gear()) + c('tanque', GW.fmt(GW.fuelPct(), 0) + '%');
      E('eta').innerHTML = c('autonomia', GW.fmt(GW.num(K.rngF), 0)) +
        c('externa', GW.fmt(GW.temp(K.out), 0) + GW.tempU()) + c('hora', GW.clock());
    }
  });
})();
</script>
